    els.toasts.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, kind === 'bad' ? 6000 : 3200);
  }
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* без вибрации */ } };
  const col = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const daysAgo = (iso) => (Date.now() - Date.parse(iso)) / 86400000;

  function statusLabel(d) {
    if (d.status === 'done') return d.kop > G.GOAL_KOP ? 'Выше плана' : 'План выполнен';
    if (d.status === 'partial') return 'Частично';
    if (d.status === 'zero') return 'Нулевой день';
    if (d.isFuture) return 'Ещё не наступил';
    return d.isToday ? 'Ожидает записи' : 'Не заполнено';
  }
  const pill = (d) => '<span class="pill ' + d.status + '">' + esc(statusLabel(d)) + '</span>';
  const notice = (kind, ico, body, action) =>
    '<div class="notice ' + kind + '">' + icon(ico, 20) + '<div class="grow">' + body + (action ? '<div style="margin-top:6px">' + action + '</div>' : '') + '</div></div>';
  const tile = (ico, k, v, s, extra) =>
    '<div class="tile ' + (extra && extra.wide ? 'wide' : '') + '"><div class="k">' + icon(ico, 15) + esc(k) + '</div><div class="v num ' + ((extra && extra.cls) || '') + '">' + v + '</div><div class="s">' + s + '</div></div>';

  /* ---------- экраны ---------- */
  function header(title, sub, right) {
    return '<header class="top"><div class="brand"><h1 style="font-size:23px;text-transform:none;letter-spacing:-0.01em">' + esc(title) + '</h1><p>' + esc(sub) + '</p></div>' + (right || '') + '</header>';
  }

  function viewHome(c) {
    const cur = c.streak.current;
    const top =
      '<header class="top"><div class="brand"><h1>Моя цель</h1><p>Каждый день приближает к результату</p><div class="date-line">' + esc(G.fmtLong(today)) + '</div></div>' +
      '<div class="streak ' + (cur > 0 ? 'hot' : '') + '" title="Серия дней подряд с выполненной целью">' + icon('flame', 17) +
      (cur > 0 ? '<b>' + cur + '</b><span>' + G.pluralRu(cur, 'день', 'дня', 'дней') + ' подряд</span>' : '<span>Серия: 0</span>') + '</div></header>';

    let notices = '';
    if (loadIssue === 'broken') notices += notice('bad', 'alert', 'Сохранённые данные не удалось прочитать, поэтому приложение открылось пустым. Повреждённая запись осталась в браузере отдельно. Если есть резервная копия, восстановите её в настройках.');
    if (!storageOk) notices += notice('bad', 'alert', 'Браузер не даёт сохранять данные на этом устройстве. Записи останутся только до закрытия страницы. Делайте резервную копию в настройках.');

    const pct = Math.max(0, Math.min(100, c.progressPct));
    const CIRC = 2 * Math.PI * 96;
    let mark = '';
    if (c.phase !== 'before' && c.planToDateKop > 0) {
      const a = 2 * Math.PI * Math.min(1, c.planToDateKop / c.totalKop);
      mark = '<circle class="ring-mark" cx="' + (110 + 96 * Math.cos(a)).toFixed(2) + '" cy="' + (110 + 96 * Math.sin(a)).toFixed(2) + '" r="6.5"/>';
    }
    const hero =
      '<section class="card hero" aria-label="Прогресс к цели">' +
      '<div class="ring-wrap"><svg class="ring" viewBox="0 0 220 220" role="img" aria-label="Выполнено ' + esc(G.fmtPct(c.progressPct)) + ' цели">' +
      '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent-2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>' +
      '<circle class="ring-bg" cx="110" cy="110" r="96"/>' +
      '<circle class="ring-fg" cx="110" cy="110" r="96" stroke-dasharray="' + CIRC.toFixed(2) + '" style="stroke-dashoffset:' + CIRC.toFixed(2) + (pct <= 0 ? ';opacity:0' : '') + '" data-offset="' + (CIRC * (1 - pct / 100)).toFixed(2) + '"/>' +
      mark + '</svg>' +
      '<div class="ring-center"><span class="eyebrow">Заработано</span>' +
      '<div class="big num" data-count="' + c.factKop / 100 + '" data-fmt="rub" data-key="fact">' + esc(R(c.factKop)) + '</div>' +
      '<div class="of">из ' + esc(R(c.totalKop)) + '</div></div></div>' +
      '<p class="hero-line">' + esc(G.heroLine(c)) + '</p>' +
      (c.phase === 'active' && c.planToDateKop > 0
        ? '<div class="legend-line"><span class="dot" style="background:var(--text);box-shadow:0 0 0 3px var(--surface-3)"></span>Где нужно быть по плану сегодня: ' + esc(R(c.planToDateKop)) + '</div>' : '') +
      '<div class="triple"><div><div class="eyebrow">Цель</div><div class="v num">' + esc(R(c.totalKop)) + '</div></div>' +
      '<div><div class="eyebrow">Прогресс</div><div class="v num" style="color:var(--accent)">' + esc(G.fmtPct(c.progressPct)) + '</div></div>' +
      '<div><div class="eyebrow">Осталось</div><div class="v num">' + esc(R(c.remainingKop)) + '</div></div></div></section>';

    const colA = hero + todayCard(c);

    let colB = '';
    if (c.missingCount > 0) {
      const first = c.missing[0];
      colB += notice('', 'info',
        'Не заполнено: <b>' + G.daysWord(c.missingCount) + '</b>. Они серые: не считаются нулевыми и не влияют на средние, но их план уже учтён в запасе. Заполните их, чтобы цифры стали точными.',
        '<button class="link-btn" data-action="open-day" data-date="' + first.date + '">Заполнить ' + esc(G.fmtDay(first.date)) + '</button>');
    }
    if (c.filledCount >= 5 && (!state.meta.lastExport || daysAgo(state.meta.lastExport) > 7)) {
      colB += notice('info', 'download', 'Сделайте резервную копию. Данные хранятся только в этом браузере.',
        '<button class="link-btn" data-action="goto" data-tab="options">Открыть настройки</button>');
    }
    colB += reserveCard(c);
    colB += fuelCard(c);
    colB += '<div class="tiles">' + homeTiles(c) + '</div>';
    colB += achievementsCard(c);

    return '<div class="view-in">' + notices + top + '<div class="cols two-wide"><div class="col">' + colA + '</div><div class="col">' + colB + '</div></div></div>';
  }

  function todayCard(c) {
    const g = G.CFG.daily;
    if (c.phase === 'before') {
      const left = G.diffDays(today, G.CFG.start);
      return '<section class="card today-card"><div class="eyebrow">Старт</div><div class="today-row"><div><div class="big num">' + esc(G.fmtDay(G.CFG.start)) +
        '</div><p class="muted small">' + esc(G.WEEKDAYS_FULL[G.weekdayIdx(G.CFG.start)]) + ', через ' + esc(G.daysWord(left)) + '</p></div><span class="pill">Ждём старта</span></div>' +
        '<p class="muted">План на каждый день: ' + esc(G.fmtRub(g)) + '. Первая запись откроется в день старта.</p>' +
        '<button class="btn block" data-action="goto" data-tab="calendar">' + icon('calendarDays') + 'Открыть календарь</button></section>';
    }
    if (c.phase === 'after') {
      return '<section class="card today-card"><div class="eyebrow">Период завершён</div><div class="today-row"><div><div class="big num">' + esc(R(c.factKop)) +
        '</div><p class="muted small">из ' + esc(R(c.totalKop)) + ' · ' + esc(G.fmtPct(c.progressPct)) + '</p></div></div>' +
        '<button class="btn block" data-action="goto" data-tab="stats">' + icon('chartColumn') + 'Посмотреть итоги</button></section>';
    }
    const td = c.todayDay;
    if (td && td.filled) {
      const delta = td.deltaKop;
      return '<section class="card today-card"><div class="eyebrow">Сегодня записано</div><div class="today-row"><div><div class="big num">' + esc(R(td.kop)) +
        '</div><p class="muted small">' + (delta === 0 ? 'Ровно по плану дня' : esc(RS(delta)) + ' к плану дня') + '</p></div>' + pill(td) + '</div>' +
        (td.entry.note ? '<p class="muted small" style="overflow-wrap:anywhere">' + esc(td.entry.note) + '</p>' : '') +
        '<div class="btn-row"><button class="btn" data-action="open-day" data-date="' + td.date + '">' + icon('pencil') + 'Изменить запись</button>' + fuelBtn(td.date) + '</div></section>';
    }
    const need = c.needTodayKop;
    let line;
    if (need <= 0) line = 'Запас уже закрывает сегодняшний план. Любая сумма добавит к запасу.';
    else if (need === c.goalKop) line = 'Ровно по графику: заработать ' + esc(G.fmtRub(g)) + '.';
    else if (need < c.goalKop) line = 'Чтобы остаться в графике, нужно <b>' + esc(R(need)) + '</b>. Остальное закрывает запас ' + esc(RS(c.reserveKop)) + '.';
    else line = 'Чтобы догнать график, нужно <b>' + esc(R(need)) + '</b>: план дня и отставание ' + esc(R(-c.reserveKop)) + '.';
    return '<section class="card today-card"><div class="eyebrow">План на сегодня</div><div class="today-row"><div><div class="big num">' + esc(G.fmtRub(g)) +
      '</div></div>' + pill(td) + '</div><p class="muted">' + line + '</p>' +
      '<div class="btn-row"><button class="btn primary" data-action="open-day" data-date="' + td.date + '">' + icon('plus') + 'Записать заработок</button>' + fuelBtn(td.date) + '</div></section>';
  }

  function reserveCard(c) {
    if (c.phase === 'before' || (c.accountableCount === 0)) {
      return '<section class="card"><div class="card-head"><h2>Запас относительно плана</h2>' + icon('trendingUp', 18) + '</div>' +
        '<p class="muted">Запас появится, как только первый день войдёт в расчёт. Сильные дни будут покрывать слабые.</p></section>';
    }
    const res = c.reserveKop;
    const top = Math.max(c.planToDateKop, c.factKop, 1);
    const word = res > 0 ? 'Опережаешь график' : res < 0 ? 'Отстаёшь от графика' : 'Точно по графику';
    return '<section class="card"><div class="card-head"><h2>Запас относительно плана</h2>' + icon(res < 0 ? 'alert' : 'trendingUp', 18) + '</div>' +
      '<div class="reserve-val num ' + (res > 0 ? 'pos' : res < 0 ? 'neg' : '') + '" data-count="' + res / 100 + '" data-fmt="signed" data-key="reserve">' + esc(RS(res)) + '</div>' +
      '<p class="muted small" style="margin-top:6px">' + word + ': заработано ' + esc(R(c.factKop)) + ' при плане ' + esc(R(c.planToDateKop)) + ' на ' + esc(G.daysWord(c.accountableCount)) + '.</p>' +
      '<div class="bars"><div class="bar-row"><span>План</span><div class="track"><i class="plan" data-w="' + (c.planToDateKop / top * 100).toFixed(1) + '"></i></div><span class="v">' + esc(R(c.planToDateKop)) + '</span></div>' +
      '<div class="bar-row"><span>Заработано</span><div class="track"><i class="' + (res < 0 ? 'amber' : '') + '" data-w="' + (c.factKop / top * 100).toFixed(1) + '"></i></div><span class="v">' + esc(R(c.factKop)) + '</span></div></div>' +
      '<p class="dim small" style="margin-top:12px">Излишек сильного дня автоматически закрывает слабый.</p></section>';
  }

  function fuelCard(c) {
    const head = '<div class="card-head"><h2>Заправка</h2><span class="fuel-ico">' + icon('fuel', 18) + '</span></div>';
    const canAdd = c.phase !== 'before';
    const addDate = c.phase === 'after' ? G.CFG.end : today;
    const addBtn = canAdd ? '<div style="margin-top:14px"><button class="btn fuel block" data-action="open-fuel" data-date="' + addDate + '">' + icon('fuel') + 'Добавить заправку</button></div>' : '';
    if (c.fuelCount === 0) {
      return '<section class="card">' + head + '<p class="muted">' + (canAdd ? 'Заправок пока нет. Записывайте каждую: сумму, литры и цену литра посчитаются сами.' : 'Заправки можно записывать со дня старта.') + '</p>' + addBtn + '</section>';
    }
    const rows = c.fuelRecent.map((e) => '<button class="fuel-row" data-action="open-fuel" data-date="' + e.date + '"><span class="fr-d">' + esc(G.fmtDayShort(e.date)) + '</span><span class="fr-m">' +
      (e.liters ? esc(G.fmtLiters(e.liters)) + ' · ' + esc(G.fmtPriceL(e.amount / e.liters)) : (e.note ? esc(e.note) : 'литры не указаны')) + '</span><b class="fr-a num">' + esc(G.fmtRub(e.amount)) + '</b></button>').join('');
    return '<section class="card">' + head +
      '<div class="fuel-big num">' + esc(R(c.fuelKop)) + '</div>' +
      '<p class="muted small" style="margin-top:6px">' + c.fuelCount + ' ' + G.pluralRu(c.fuelCount, 'заправка', 'заправки', 'заправок') + ' за период, в среднем ' + esc(R(c.avgRefuelKop)) + '.</p>' +
      '<div class="kv" style="margin-top:14px"><div><div class="eyebrow">Литров</div><div class="v">' + (c.fuelLiters ? esc(G.fmtLiters(c.fuelLiters)) : '—') + '</div></div>' +
      '<div><div class="eyebrow">Цена литра</div><div class="v">' + (c.fuelPriceRub ? esc(G.fmtPriceL(c.fuelPriceRub)) : '—') + '</div></div>' +
      '<div><div class="eyebrow">От заработка</div><div class="v">' + (c.fuelPct === null ? '—' : esc(G.fmtPct(c.fuelPct))) + '</div></div></div>' +
      '<div class="fuel-net"><span>Остаётся после заправки</span><b class="num">' + esc(R(c.netKop)) + '</b></div>' +
      '<div class="fuel-list">' + rows + '</div>' + addBtn +
      '<p class="dim small" style="margin-top:12px">Заправка учитывается отдельно. План, запас и серия считаются по заработку без неё.</p></section>';
  }

  function homeTiles(c) {
    const planPct = c.planPct === null ? '—' : G.fmtPct(c.planPct);
    let forecast = '—', forecastSub = 'Появится после первой записи';
    if (c.projectedKop !== null) {
      forecast = R(c.projectedKop);
      forecastSub = c.projectedDeltaKop >= 0 ? 'К финишу при текущем темпе, с запасом ' + R(c.projectedDeltaKop) : 'К финишу при текущем темпе, не хватит ' + R(-c.projectedDeltaKop);
    }
    return [
      tile('percent', 'Выполнение плана', esc(planPct), c.planPct === null ? 'План ещё не начался' : 'от плана на сегодня', { cls: c.planPct !== null && c.planPct >= 100 ? 'pos' : '' }),
      tile('calendarCheck', 'Дней выполнено', String(c.doneCount), 'цель достигнута · заполнено ' + c.filledCount + ' из ' + c.dayCount),
      tile('hourglass', 'Дней осталось', String(c.remainingDays), c.phase === 'after' ? 'период завершён' : 'до ' + esc(G.fmtDay(G.CFG.end))),
      tile('chartColumn', 'Средний за день', c.avgFilledKop === null ? '—' : esc(R(c.avgFilledKop)), c.avgFilledKop === null ? 'пока нет записей' : 'по ' + c.filledCount + ' заполненным дням'),
      tile('gauge', 'Нужный темп', c.requiredPaceRub === null ? '—' : esc(G.fmtRub(c.requiredPaceRub)), c.requiredPaceRub === null ? 'дней не осталось' : 'в день, чтобы собрать ' + esc(R(c.totalKop))),
      tile('trendingUp', 'Прогноз', esc(forecast), esc(forecastSub))
    ].join('');
  }

  function achievementsCard(c) {
    const n = c.achievements.filter((a) => a.unlocked).length;
    const items = c.achievements.map((a) => {
      const sub = a.unlocked ? 'Получено'
        : a.unit === 'rub' ? 'Осталось ' + G.fmtRub(a.need - a.have)
        : a.unit === 'days' ? a.have + ' из ' + a.need + ' дней'
        : 'Ещё не получено';
      return '<div class="ach ' + (a.unlocked ? 'on' : '') + '"><div class="ach-ico">' + icon(a.icon, 18) + '</div><div class="t">' + esc(a.title) + '</div>' +
        '<div class="track"><i data-w="' + (a.ratio * 100).toFixed(1) + '"></i></div><div class="h">' + esc(sub) + '</div></div>';
    }).join('');
    return '<section class="card"><div class="card-head"><h2>Достижения</h2><span class="muted small">' + n + ' из ' + c.achievements.length + '</span></div><div class="ach-grid">' + items + '</div></section>';
  }

  /* календарь */
  function viewCalendar(c) {
    const groups = [];
    c.days.forEach((d) => {
      const key = G.yearOf(d.date) + '-' + G.monthIdx(d.date);
      let g = groups[groups.length - 1];
      if (!g || g.key !== key) { g = { key, month: G.monthIdx(d.date), year: G.yearOf(d.date), days: [] }; groups.push(g); }
      g.days.push(d);
    });
    const months = groups.map((g) => {
      let fact = 0, plan = 0;
      g.days.forEach((d) => { plan += c.goalKop; if (d.filled) fact += d.kop; });
      const lead = G.weekdayIdx(g.days[0].date);
      let cells = G.WEEKDAYS_SHORT.map((w) => '<div class="wd">' + w + '</div>').join('');
      for (let i = 0; i < lead; i++) cells += '<div class="cell blank" aria-hidden="true"></div>';
      cells += g.days.map((d) => {
        // копейки показываем «ценником» (2 500⁵⁰): так сумма не округляется и помещается в ячейку
        const full = d.filled ? G.fmtNum(d.amount) : '—';
        const comma = full.indexOf(',');
        const whole = comma < 0 ? full : full.slice(0, comma);
        const f = comma < 0 ? esc(full) : esc(whole) + '<sup>' + esc(full.slice(comma + 1)) + '</sup>';
        const aria = G.fmtWeekdayDay(d.date) + ': ' + (d.filled ? 'заработано ' + G.fmtRub(d.amount) : statusLabel(d).toLowerCase()) + ', план ' + G.fmtRub(G.CFG.daily) + (d.fuelCount ? ', заправка ' + G.fmtRub(d.fuelKop / 100) : '');
        return '<button class="' + cls('cell', d.status, d.isToday && 'today', d.isFuture && !d.isToday && 'future', d.isPast && 'past') + '" data-action="open-day" data-date="' + d.date + '" aria-label="' + esc(aria) + '">' +
          '<span class="d">' + G.dayOfMonth(d.date) + '</span><span class="st"></span>' + (d.fuelCount ? '<span class="fu">' + icon('fuel', 10) + '</span>' : '') +
          '<span class="f ' + (whole.length >= 6 ? 'long' : '') + '">' + f + '</span>' +
          '<span class="p"><span class="pw">план </span>' + G.fmtNum(G.CFG.daily) + '<span class="pw"> ₽</span></span></button>';
      }).join('');
      return '<section class="card"><div class="month-head"><h2>' + G.MONTHS_NOM[g.month] + ' ' + g.year + '</h2><div class="sum">' + esc(R(fact)) + ' <span class="dim">из ' + esc(R(plan)) + '</span></div></div><div class="cal-grid">' + cells + '</div></section>';
    }).join('');
    const todayBtn = c.phase === 'active'
      ? '<button class="btn sm primary" data-action="open-day" data-date="' + today + '">' + icon('plus', 16) + 'Сегодня</button>' : '';
    const legend = '<div class="legend"><span><i class="dot" style="background:var(--accent)"></i>2 000 ₽ и больше</span><span><i class="dot" style="background:var(--amber)"></i>Меньше плана</span><span><i class="dot" style="background:var(--red)"></i>Нулевой день</span><span><i class="dot" style="background:var(--idle)"></i>Не заполнено</span><span class="lg-fuel">' + icon('fuel', 13) + 'Заправка</span></div>';
    return '<div class="view-in">' + header('Календарь', G.fmtDay(G.CFG.start) + ' — ' + G.fmtDay(G.CFG.end) + ' · ' + c.dayCount + ' дня. Нажмите на день, чтобы записать заработок.', todayBtn) +
      legend + '<div class="cols two">' + months + '</div></div>';
  }

  /* недели и периоды */
  function groupCard(g, kind) {
    const label = kind === 'week' ? 'Неделя ' + (g.index + 1) : 'Период ' + (g.index + 1);
    const stateText = g.state === 'past' ? 'Завершён' : g.state === 'current' ? 'Идёт' : 'Впереди';
    const pcls = g.state === 'past' ? (g.diffKop >= 0 ? 'done' : 'partial') : g.state === 'current' ? 'live' : 'empty';
    const diff = g.accountableCount === 0 ? '—' : RS(g.diffKop);
    const dcls = g.accountableCount === 0 ? '' : g.diffKop > 0 ? 'pos' : g.diffKop < 0 ? 'neg' : '';
    const strip = '<div class="strip ' + (g.length > 7 ? 'p14' : '') + '">' + g.strip.map((s) => '<i class="' + s.status + (s.isToday ? ' today' : '') + '" title="' + esc(G.fmtDay(s.date)) + '"></i>').join('') + '</div>';
    const third = kind === 'week'
      ? '<div><div class="eyebrow">Выполнено</div><div class="v">' + g.doneCount + ' из ' + g.length + ' дн.</div></div>'
      : '<div><div class="eyebrow">Средний день</div><div class="v">' + (g.avgKop === null ? '—' : esc(R(g.avgKop))) + '</div></div>';
    const fuelLine = g.fuelKop > 0 ? '<p class="fuel-line">' + icon('fuel', 14) + '<span>Заправка ' + esc(R(g.fuelKop)) + ' · остаётся ' + esc(R(g.netKop)) + '</span></p>' : '';
    const note = g.state === 'current' && g.accountableCount > 0
      ? '<p class="dim small">Разница считается к плану на сегодня: ' + esc(R(g.planToDateKop)) + '.</p>'
      : g.state === 'past' && g.filledCount < g.length ? '<p class="dim small">Не заполнено дней: ' + (g.length - g.filledCount) + '. Они пока без заработка.</p>' : '';
    return '<article class="card wk"><div class="wk-top"><div><div class="t">' + label + '</div><div class="r">' + esc(G.fmtRange(g.start, g.end)) + ' · ' + esc(G.daysWord(g.length)) + '</div></div><span class="pill ' + pcls + '">' + stateText + '</span></div>' +
      '<div class="wk-main"><div class="big num">' + esc(R(g.factKop)) + '</div><div class="of">из ' + esc(R(g.planKop)) + ' плана</div></div>' +
      '<div class="track"><i class="' + (g.diffKop < 0 && g.state === 'past' ? 'amber' : '') + '" data-w="' + Math.min(100, g.pct).toFixed(1) + '"></i></div>' + strip +
      '<div class="kv"><div><div class="eyebrow">Разница</div><div class="v ' + dcls + '">' + esc(diff) + '</div></div>' +
      '<div><div class="eyebrow">Выполнение</div><div class="v">' + esc(G.fmtPct(g.pct)) + '</div></div>' + third + '</div>' + fuelLine + note + '</article>';
  }

  function viewWeeks(c) {
    const isW = weeksMode === 'weeks';
    const list = (isW ? c.weeks : c.periods).map((g) => groupCard(g, isW ? 'week' : 'period')).join('');
    let summary = '';
    if (!isW) {
      const past = c.periods.filter((g) => g.state === 'past');
      const ok = past.filter((g) => g.diffKop >= 0).length;
      summary = '<p class="muted small" style="margin-top:12px">' + (past.length ? 'Завершено периодов: ' + past.length + ', выполнено по плану: ' + ok + '.' : 'Первый период закончится ' + esc(G.fmtDay(c.periods[0].end)) + '.') + '</p>';
    }
    return '<div class="view-in">' + header(isW ? 'Мои недели' : 'Периоды по 14 дней', isW ? 'Календарные недели с понедельника по воскресенье' : 'Контроль двухнедельных отрезков с ' + G.fmtDay(G.CFG.start), '') +
      '<div class="seg" role="radiogroup" aria-label="Режим"><button role="radio" aria-checked="' + isW + '" data-action="weeks-mode" data-mode="weeks">Недели</button><button role="radio" aria-checked="' + !isW + '" data-action="weeks-mode" data-mode="periods">14 дней</button></div>' +
      '<section class="card"><div class="card-head"><h2>План и факт</h2></div><div class="mini-legend"><span><i class="dot" style="background:var(--idle)"></i>План</span><span><i class="dot" style="background:var(--accent)"></i>Факт</span></div>' +
      '<div class="chart-box"><canvas data-chart="' + (isW ? 'weeks' : 'periods') + '" role="img" aria-label="График плана и факта"></canvas></div>' + summary + '</section>' +
      '<div class="cols two">' + list + '</div></div>';
  }

  /* статистика */
  function viewStats(c) {
    const b = c.best, w = c.worst;
    const bd = (d) => d ? esc(R(d.kop)) : '—';
    const bs = (d) => d ? esc(G.fmtWeekdayDay(d.date)) : 'Пока нет рабочих дней';
    const tiles =
      tile('trendingUp', 'Самый прибыльный день', bd(b), bs(b), { cls: b ? 'pos' : '' }) +
      tile('alert', 'Самый слабый день', bd(w), bs(w)) +
      tile('chartColumn', 'Средний за рабочий день', c.avgWorkingKop === null ? '—' : esc(R(c.avgWorkingKop)), c.workingCount ? 'рабочих дней: ' + c.workingCount : 'рабочий день — с заработком больше 0') +
      tile('zap', 'Перевыполнение', esc(R(c.overKop)), 'сумма сверх плана за сильные дни', { cls: c.overKop > 0 ? 'pos' : '' }) +
      tile('calendarCheck', 'Дней с целью', c.doneCount + ' из ' + c.filledCount, 'среди заполненных дней') +
      tile('calendarDays', 'Нулевых дней', String(c.zeroCount), 'дни без заработка (выходные)');
    const chartCard = (id, title, legend, note) =>
      '<section class="card stat-chart"><div class="card-head"><h2>' + title + '</h2></div>' + (legend ? '<div class="mini-legend">' + legend + '</div>' : '') +
      '<div class="chart-box"><canvas data-chart="' + id + '" role="img" aria-label="' + esc(title) + '"></canvas></div>' + (note ? '<p class="note">' + note + '</p>' : '') + '</section>';
    let fnote = '';
    if (c.projectedKop !== null) {
      fnote = 'При текущем темпе к ' + esc(G.fmtDay(G.CFG.end)) + ' получится около ' + esc(R(c.projectedKop)) + (c.projectedDeltaKop >= 0 ? ': цель выполняется с запасом ' + esc(R(c.projectedDeltaKop)) + '.' : ': не хватит ' + esc(R(-c.projectedDeltaKop)) + ' до ' + esc(R(c.totalKop)) + '.');
    }
    const l = (color, text, dash) => '<span><i class="ln ' + (dash ? 'dash' : '') + '" style="color:' + color + '"></i>' + text + '</span>';
    return '<div class="view-in">' + header('Статистика', 'Все цифры считаются из ваших записей') + '<div class="tiles">' + tiles + '</div>' +
      '<div class="cols two">' +
      chartCard('daily', 'Заработок по дням', '<span><i class="dot" style="background:var(--accent)"></i>План выполнен</span><span><i class="dot" style="background:var(--amber)"></i>Меньше плана</span><span><i class="dot" style="background:var(--red)"></i>Ноль</span>' + l('var(--text-3)', 'План ' + G.fmtRub(G.CFG.daily), true)) +
      chartCard('delta', 'План и факт: отклонение', '<span><i class="dot" style="background:var(--accent)"></i>День к плану</span>' + l('var(--text)', 'Запас нарастающим итогом'), 'Столбцы показывают, насколько день выше или ниже плана. Линия — общий запас. Незаполненные прошедшие дни пока без заработка и сдвигают линию вниз.') +
      chartCard('cumulative', 'Путь к ' + esc(R(c.totalKop)), l('var(--accent)', 'Факт') + l('var(--text-3)', 'План', true) + l('var(--accent-2)', 'Прогноз', true), fnote) +
      chartCard('weeks2', 'Заработок по неделям', '<span><i class="dot" style="background:var(--idle)"></i>План</span><span><i class="dot" style="background:var(--accent)"></i>Факт</span>') +
      '</div>' + fuelStats(c, chartCard) + '</div>';
  }

  function fuelStats(c, chartCard) {
    const cnt = c.fuelCount + ' ' + G.pluralRu(c.fuelCount, 'заправка', 'заправки', 'заправок');
    const tiles =
      tile('fuel', 'Заправлено на сумму', esc(R(c.fuelKop)), c.fuelCount ? esc(cnt) + ', дней: ' + c.fuelDays : 'заправок пока нет') +
      tile('droplet', 'Литров', c.fuelLiters ? esc(G.fmtLiters(c.fuelLiters)) : '—', c.fuelLiters ? 'всего за период' : 'литры не указаны') +
      tile('percent', 'Цена литра', c.fuelPriceRub ? esc(G.fmtPriceL(c.fuelPriceRub)) : '—', 'в среднем по заправкам с литрами') +
      tile('trendingUp', 'Остаётся после заправки', esc(R(c.netKop)), c.fuelPct === null ? 'заработок минус заправка' : 'заправка — ' + esc(G.fmtPct(c.fuelPct)) + ' заработка', { cls: c.netKop < 0 ? 'neg' : '' });
    return '<div class="group-head"><h2 class="screen-title" style="font-size:19px">Заправка</h2><p class="screen-sub">Отдельный учёт: на план и запас не влияет</p></div>' +
      '<div class="tiles four">' + tiles + '</div>' + chartCard('fuel', 'Заправка по дням', '', 'Столбцы показывают сумму всех заправок за день.');
  }

  /* ---------- графики ---------- */
  function setupChartDefaults() {
    const D = Chart.defaults;
    D.font.family = getComputedStyle(document.body).fontFamily;
    D.font.size = 11;
    D.color = col('--text-3');
    D.animation = reduceMotion() ? false : { duration: 650 };
  }
  const tip = (title, label) => ({
    backgroundColor: col('--surface-3'), titleColor: col('--text'), bodyColor: col('--text-2'), borderColor: col('--line-2'), borderWidth: 1,
    padding: 10, cornerRadius: 10, boxPadding: 4, titleFont: { weight: '700' }, callbacks: { title, label }
  });
  const scaleX = () => ({ grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8, color: col('--text-3') } });
  const scaleY = (extra) => Object.assign({ border: { display: false }, grid: { color: col('--grid') }, ticks: { color: col('--text-3'), callback: (v) => G.fmtNum(v) } }, extra || {});
  const baseOpts = () => ({ responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, layout: { padding: { top: 6, right: 4 } } });
  const kr = (k) => (k === null ? null : k / 100);
  const dayLabels = (c) => c.days.map((d) => String(G.dayOfMonth(d.date)).padStart(2, '0') + '.' + String(G.monthIdx(d.date) + 1).padStart(2, '0'));
  const rubLabel = (ctx) => (ctx.parsed.y === null || ctx.parsed.y === undefined ? '' : ' ' + ctx.dataset.label + ': ' + G.fmtRub(ctx.parsed.y));

  function groupChart(list, labels) {
    return {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'План', data: list.map((g) => g.planKop / 100), backgroundColor: col('--idle'), borderRadius: 6, maxBarThickness: 26 },
          { label: 'Факт', data: list.map((g) => g.factKop / 100), backgroundColor: col('--accent'), borderRadius: 6, maxBarThickness: 26 }
        ]
      },
      options: Object.assign(baseOpts(), {
        plugins: { legend: { display: false }, tooltip: tip((items) => { const l = items[0].label; return Array.isArray(l) ? l.join(' · ') : String(l).replace(/,/g, ' · '); }, rubLabel) },
        scales: { x: Object.assign(scaleX(), { ticks: { maxRotation: 0, autoSkip: false, color: col('--text-3') } }), y: scaleY({ beginAtZero: true }) }
      })
    };
  }

  const CHARTS = {
    weeks: (c) => groupChart(c.weeks, c.weeks.map((g) => ['Нед. ' + (g.index + 1), G.fmtRange(g.start, g.end)])),
    weeks2: (c) => groupChart(c.weeks, c.weeks.map((g) => ['Нед. ' + (g.index + 1), G.fmtRange(g.start, g.end)])),
    periods: (c) => groupChart(c.periods, c.periods.map((g) => ['Период ' + (g.index + 1), G.fmtRange(g.start, g.end)])),
    daily: (c) => ({
      type: 'bar',
      data: {
        labels: dayLabels(c),
        datasets: [
          { type: 'bar', label: 'Заработано', data: c.days.map((d) => kr(d.kop)), order: 2, borderRadius: 3, maxBarThickness: 14,
            backgroundColor: c.days.map((d) => (d.status === 'done' ? col('--accent') : d.status === 'partial' ? col('--amber') : col('--red'))) },
          { type: 'line', label: 'План', data: c.days.map(() => G.CFG.daily), order: 1, borderColor: col('--text-3'), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 0, fill: false }
        ]
      },
      options: Object.assign(baseOpts(), {
        plugins: { legend: { display: false }, tooltip: tip((items) => G.fmtWeekdayDay(c.days[items[0].dataIndex].date), rubLabel) },
        scales: { x: scaleX(), y: scaleY({ beginAtZero: true, suggestedMax: G.CFG.daily * 1.5 }) }
      })
    }),
    delta: (c) => ({
      type: 'bar',
      data: {
        labels: dayLabels(c),
        datasets: [
          { type: 'bar', label: 'День к плану', data: c.days.map((d) => kr(d.deltaKop)), order: 2, borderRadius: 3, maxBarThickness: 14,
            backgroundColor: c.days.map((d) => (d.deltaKop !== null && d.deltaKop >= 0 ? col('--accent') : col('--red'))) },
          { type: 'line', label: 'Запас', data: c.series.reserve.map(kr), order: 1, borderColor: col('--text'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false }
        ]
      },
      options: Object.assign(baseOpts(), {
        plugins: { legend: { display: false }, tooltip: tip((items) => G.fmtWeekdayDay(c.days[items[0].dataIndex].date), (ctx) => (ctx.parsed.y === null ? '' : ' ' + ctx.dataset.label + ': ' + G.fmtSigned(ctx.parsed.y))) },
        scales: { x: scaleX(), y: scaleY({ grid: { color: (ctx) => (ctx.tick && ctx.tick.value === 0 ? col('--line-2') : col('--grid')) } }) }
      })
    }),
    fuel: (c) => ({
      type: 'bar',
      data: { labels: dayLabels(c), datasets: [{ label: 'Заправка', data: c.days.map((d) => (d.fuelKop ? d.fuelKop / 100 : null)), backgroundColor: col('--fuel'), borderRadius: 3, maxBarThickness: 14 }] },
      options: Object.assign(baseOpts(), {
        plugins: { legend: { display: false }, tooltip: tip((items) => G.fmtWeekdayDay(c.days[items[0].dataIndex].date), rubLabel) },
        scales: { x: scaleX(), y: scaleY({ beginAtZero: true }) }
      })
    }),
    cumulative: (c) => ({
      type: 'line',
      data: {
        labels: dayLabels(c),
        datasets: [
          { label: 'Факт', data: c.series.cumFact.map(kr), borderColor: col('--accent'), backgroundColor: col('--accent-soft'), fill: 'origin', borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.2, spanGaps: false, order: 1 },
          { label: 'План', data: c.series.cumPlan.map(kr), borderColor: col('--text-3'), borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 0, fill: false, order: 3 },
          { label: 'Прогноз', data: c.series.forecast.map(kr), borderColor: col('--accent-2'), borderDash: [2, 4], borderWidth: 2, pointRadius: 0, pointHoverRadius: 0, fill: false, order: 2 }
        ]
      },
      options: Object.assign(baseOpts(), {
        plugins: { legend: { display: false }, tooltip: tip((items) => G.fmtWeekdayDay(c.days[items[0].dataIndex].date), rubLabel) },
        scales: { x: scaleX(), y: scaleY({ beginAtZero: true, suggestedMax: c.totalKop / 100 }) }
      })
    })
  };

  // подгоняем размер суммы в ячейках календаря под реальную ширину (зависит от шрифта и экрана)
  function fitCells() {
    if (tab !== 'calendar') return;
    els.view.querySelectorAll('.cell .f').forEach((el) => {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize) || 11;
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 0.5 && size > 6.5 && guard++ < 14) { size -= 0.5; el.style.fontSize = size + 'px'; }
    });
  }
  let fitTimer = null;
  window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitCells, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitCells());

  function destroyCharts() { charts.forEach((ch) => { try { ch.destroy(); } catch (e) { /* уже удалён */ } }); charts = []; }
  function drawCharts(c) {
    destroyCharts();
    const boxes = els.view.querySelectorAll('canvas[data-chart]');
    if (!boxes.length) return;
    const msg = (cv, text) => cv.parentElement.insertAdjacentHTML('beforeend', '<div class="chart-empty">' + text + '</div>');
    if (typeof Chart === 'undefined') { boxes.forEach((cv) => msg(cv, 'График не загрузился. Проверьте интернет и обновите страницу.')); return; }
    setupChartDefaults();
    boxes.forEach((cv) => {
      const id = cv.dataset.chart;
      if (((id === 'daily' || id === 'delta') && c.filledCount === 0) || (id === 'fuel' && c.fuelCount === 0)) {
        msg(cv, id === 'fuel' ? 'График появится после первой заправки.' : 'График появится после первой записи.');
        cv.style.visibility = 'hidden';
        return;
      }
      try { charts.push(new Chart(cv, CHARTS[id](c))); } catch (e) { msg(cv, 'Не удалось построить график.'); if (window.console) console.error(e); }
    });
  }

  /* ---------- окна ---------- */
  function openDayState(date) {
    const e = state.days[date];
    ds = { date, value: e ? String(e.amount).replace('.', ',') : '', note: e ? e.note || '' : '', error: '', confirmClear: false };
  }

  function daySheetHtml(c) {
    const d = c.days.find((x) => x.date === ds.date);
    const locked = d.isFuture && !d.filled;
    const i = d.idx;
    const prev = i > 0 ? c.days[i - 1].date : null;
    const next = i < c.days.length - 1 ? c.days[i + 1].date : null;
    const head =
      '<div class="grab"></div><div class="sheet-head"><div><h2 id="sheet-title">' + esc(G.fmtWeekdayDay(d.date)) + '</h2>' +
      '<div class="sub">День ' + (i + 1) + ' из ' + c.dayCount + ' · план ' + esc(G.fmtRub(G.CFG.daily)) + '</div></div>' +
      '<div class="head-actions"><button class="icon-btn" data-action="day-nav" data-date="' + (prev || '') + '" aria-label="Предыдущий день"' + (prev ? '' : ' disabled') + '>' + icon('chevronLeft') + '</button>' +
      '<button class="icon-btn" data-action="day-nav" data-date="' + (next || '') + '" aria-label="Следующий день"' + (next ? '' : ' disabled') + '>' + icon('chevronRight') + '</button>' +
      '<button class="icon-btn" data-action="close-sheet" aria-label="Закрыть">' + icon('x') + '</button></div></div>';
    if (locked) {
      return head + '<div class="locked">' + icon('lock', 30) + '<p>Этот день ещё не наступил.</p><p class="small dim" style="margin-top:6px">Запись откроется ' + esc(G.fmtDay(d.date)) + '. Будущие дни не считаются пропущенными.</p></div>' +
        '<div class="btn-row"><button class="btn" data-action="close-sheet">Понятно</button></div>';
    }
    const chips = [['0', 'Не работал · 0'], ['1000', '1 000'], ['2000', '2 000 · план'], ['3000', '3 000']]
      .map((ch) => '<button type="button" class="chip" data-action="chip" data-val="' + ch[0] + '">' + ch[1] + '</button>').join('');
    return head +
      '<form id="day-form" novalidate><label class="label" for="amt"><span>Фактический заработок</span></label>' +
      '<div class="amount-box"><input id="amt" class="field' + (ds.error ? ' err' : '') + '" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" value="' + esc(ds.value) + '" aria-describedby="amt-err amt-live"><span class="field-unit">₽</span></div>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="err-msg" id="amt-err" role="alert">' + esc(ds.error) + '</div><div class="live" id="amt-live" aria-live="polite"></div>' +
      '<label class="label" for="note"><span>Комментарий</span><span id="note-count">' + ds.note.length + '/' + G.CFG.noteMax + '</span></label>' +
      '<textarea id="note" class="txt-area" rows="3" maxlength="' + G.CFG.noteMax + '" placeholder="Смена, количество заказов, погода…">' + esc(ds.note) + '</textarea>' +
      '<div class="btn-row"><button type="submit" class="btn primary">' + icon('check') + 'Сохранить</button>' +
      (d.filled ? '<button type="button" class="btn danger" data-action="clear-day">' + icon('trash') + (ds.confirmClear ? 'Точно очистить?' : 'Очистить день') + '</button>' : '') + '</div>' +
      '<button type="button" class="btn fuel block" style="margin-top:10px" data-action="to-fuel" data-date="' + d.date + '">' + icon('fuel') + 'Заправка за день' + (d.fuelCount ? ': ' + esc(R(d.fuelKop)) : '') + '</button>' +
      (d.filled && d.entry.ts ? '<p class="dim small" style="margin-top:12px;text-align:center">Обновлено ' + esc(new Date(d.entry.ts).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })) + '</p>' : '') +
      '</form>';
  }

  function updateDayLive() {
    const live = $('#amt-live');
    if (!live || !ds) return;
    const inp = $('#amt');
    const err = $('#amt-err');
    live.className = 'live';
    if (ds.value.trim() === '') { live.textContent = ''; if (err) err.textContent = ds.error; if (inp) inp.classList.toggle('err', !!ds.error); document.querySelectorAll('.chip').forEach((c) => c.classList.remove('on')); return; }
    const p = G.parseAmount(ds.value);
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', p.ok && G.kop(p.value) === G.kop(Number(c.dataset.val))));
    if (!p.ok) { ds.error = G.AMOUNT_ERRORS[p.error]; if (err) err.textContent = ds.error; if (inp) inp.classList.add('err'); live.textContent = ''; return; }
    ds.error = ''; if (err) err.textContent = ''; if (inp) inp.classList.remove('err');
    const k = G.kop(p.value);
    const delta = k - G.GOAL_KOP;
    const test = JSON.parse(JSON.stringify(state));
    test.days[ds.date] = { amount: p.value, note: '', ts: null };
    const reserve = G.compute(test, today).reserveKop;
    let a;
    if (k === 0) { a = 'Не работал: день будет записан как нулевой.'; live.classList.add('neg'); }
    else if (delta > 0) { a = esc(RS(delta)) + ' сверх плана дня.'; live.classList.add('pos'); }
    else if (delta === 0) { a = 'Ровно по плану дня.'; live.classList.add('pos'); }
    else { a = 'До плана дня не хватает ' + esc(R(-delta)) + '.'; live.classList.add('neg'); }
    live.innerHTML = a + ' <span class="dim">Запас после записи: ' + esc(RS(reserve)) + '.</span>';
  }

  /* ---------- заправка ---------- */
  function openFuelState(date) {
    fu = { date, amount: '', liters: '', note: '', editId: null, error: '', confirmDel: null, noFocus: false };
  }

  function fuelSheetHtml(c) {
    const d = c.days.find((x) => x.date === fu.date);
    const i = d.idx;
    const prev = i > 0 ? c.days[i - 1].date : null;

      '<div class="head-actions"><button class="icon-btn" data-action="fuel-nav" data-date="' + (prev || '') + '" aria-label="Предыдущий день"' + (prev ? '' : ' disabled') + '>' + icon('chevronLeft') + '</button>' +
      '<button class="icon-btn" data-action="fuel-nav" data-date="' + (next || '') + '" aria-label="Следующий день"' + (next ? '' : ' disabled') + '>' + icon('chevronRight') + '</button>' +
      '<button class="icon-btn" data-action="close-sheet" aria-label="Закрыть">' + icon('x') + '</button></div></div>';

    }).join('');
    const chips = ['500', '1000', '1500', '2000'].map((v) => '<button type="button" class="chip" data-action="fuel-chip" data-val="' + v + '">' + G.fmtNum(Number(v)) + '</button>').join('');
    const editing = !!fu.editId;
    return head + (items ? '<div class="fuel-items">' + items + '</div>' : '') +
      '<form id="fuel-form" novalidate><div class="label"><span>' + (editing ? 'Изменить заправку' : (items ? 'Ещё одна заправка' : 'Новая заправка')) + '</span></div>' +
      '<div class="fuel-fields"><div><label class="label" for="f-amt"><span>Сумма, ₽</span></label><input id="f-amt" class="field sm" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" value="' + esc(fu.amount) + '"></div>' +
      '<div><label class="label" for="f-lit"><span>Литры</span></label><input id="f-lit" class="field sm" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="необязательно" value="' + esc(fu.liters) + '"></div></div>' +
      '<div class="chips" style="margin-top:10px">' + chips + '</div>' +

  function updateFuelLive() {
    if (!fu) return;
    const live = $('#f-live'), err = $('#f-err');
    if (!live || !err) return;
    const a = fu.amount.trim() === '' ? null : G.parseFuelAmount(fu.amount);
    const l = G.parseLiters(fu.liters);
    document.querySelectorAll('[data-action="fuel-chip"]').forEach((ch) => ch.classList.toggle('on', !!a && a.ok && G.kop(a.value) === G.kop(Number(ch.dataset.val))));
    let msg = '';
    if (a && !a.ok) msg = G.AMOUNT_ERRORS[a.error];
    else if (!l.ok) msg = G.AMOUNT_ERRORS[l.error];
    err.textContent = msg || fu.error;
    const ai = $('#f-amt'), li = $('#f-lit');
    if (ai) ai.classList.toggle('err', (!!a && !a.ok) || (!!fu.error && !a));
    if (li) li.classList.toggle('err', !l.ok);
    live.textContent = a && a.ok && l.ok && l.value ? 'Цена литра: ' + G.fmtPriceL(a.value / l.value) : '';
  }

  function saveFuel() {
    const fail = (msg, sel) => { fu.error = msg; updateFuelLive(); const f = $(sel); if (f) f.focus(); buzz(40); };
    if (fu.amount.trim() === '') return fail('Введите сумму заправки', '#f-amt');
    const a = G.parseFuelAmount(fu.amount);
    if (!a.ok) return fail(G.AMOUNT_ERRORS[a.error], '#f-amt');
    const l = G.parseLiters(fu.liters);
    if (!l.ok) return fail(G.AMOUNT_ERRORS[l.error], '#f-lit');
    const list = state.fuel[fu.date] || (state.fuel[fu.date] = []);
    const note = fu.note.trim().slice(0, G.CFG.fuelNoteMax);
    const now = new Date().toISOString();
    const wasEdit = !!fu.editId;
    if (wasEdit) {
      const e = list.find((x) => x.id === fu.editId);
      if (e) { e.amount = a.value; e.liters = l.value; e.note = note; e.ts = now; }
    } else {
      if (list.length >= G.CFG.fuelMax) { toast('За один день можно записать не больше ' + G.CFG.fuelMax + ' заправок', 'bad'); return; }
      list.push({ id: G.makeId(), amount: a.value, liters: l.value, note, ts: now });
    }
    persist();
    Object.assign(fu, { amount: '', liters: '', note: '', editId: null, error: '', confirmDel: null, noFocus: false });
    sheetRev++;
    buzz(18);
    render();
    toast(wasEdit ? 'Заправка изменена' : 'Заправка записана: ' + G.fmtRub(a.value));
  }

  function editFuel(id) {
    const e = (state.fuel[fu.date] || []).find((x) => x.id === id);
    if (!e) return;
    Object.assign(fu, { editId: id, amount: String(e.amount).replace('.', ','), liters: e.liters ? String(e.liters).replace('.', ',') : '', note: e.note || '', error: '', noFocus: false });
    sheetRev++; renderSheet();
  }
  function cancelFuelEdit() {
    Object.assign(fu, { editId: null, amount: '', liters: '', note: '', error: '', noFocus: false });
    sheetRev++; renderSheet();
  }
  function deleteFuel(id, btn) {
    if (fu.confirmDel !== id) {
      fu.confirmDel = id;
      btn.classList.add('armed');
      btn.textContent = 'Удалить?';
      clearTimeout(deleteFuel.t);
      deleteFuel.t = setTimeout(() => {
        if (fu) fu.confirmDel = null;
        if (document.contains(btn)) { btn.classList.remove('armed'); btn.innerHTML = icon('trash', 18); }
      }, 3500);
      return;
    }
    const list = state.fuel[fu.date] || [];
    const idx = list.findIndex((x) => x.id === id);
    if (idx >= 0) list.splice(idx, 1);
    if (!list.length) delete state.fuel[fu.date];
    if (fu.editId === id) Object.assign(fu, { editId: null, amount: '', liters: '', note: '' });
    fu.confirmDel = null; fu.noFocus = true;
    persist(); sheetRev++; render();
    toast('Заправка удалена');
  }

      '<label class="btn block" for="imp-file" style="cursor:pointer">' + icon('upload') + 'Выбрать файл</label><input id="imp-file" class="sr" type="file" accept="application/json,.json,text/plain">' +
      '<div class="label" style="margin-top:14px"><span>Или вставьте текст копии</span></div><textarea id="imp-text" class="txt-area mono" placeholder="{ &quot;app&quot;: &quot;moya-cel&quot;, … }">' + esc(imp.text) + '</textarea>' + preview +

  function resetSheetHtml() {
    const ok = rst.word.trim().toUpperCase() === 'СБРОС';
    return '<div class="grab"></div><div class="sheet-head"><div><h2 id="sheet-title">Сбросить все данные?</h2><div class="sub">Это действие удалит все записи и комментарии</div></div><button class="icon-btn" data-action="close-sheet" aria-label="Закрыть">' + icon('x') + '</button></div>' +
      '<div class="notice bad">' + icon('alert', 20) + '<div class="grow">Будет удалено <b>' + G.daysWord(C.filledCount) + '</b> на сумму <b>' + esc(R(C.factKop)) + '</b>' + (C.fuelCount ? ' и <b>' + C.fuelCount + ' ' + G.pluralRu(C.fuelCount, 'заправка', 'заправки', 'заправок') + '</b> на <b>' + esc(R(C.fuelKop)) + '</b>' : '') + '. Сначала лучше сохранить резервную копию.</div></div>' +
      '<div style="margin-top:12px">' + exportRow() + '</div>' +
      '<label class="label" for="reset-word" style="margin-top:16px"><span>Для подтверждения введите слово СБРОС</span></label><input id="reset-word" class="confirm-input" type="text" autocomplete="off" autocapitalize="characters" value="' + esc(rst.word) + '">' +
      '<div class="btn-row"><button class="btn danger solid" id="reset-go" data-action="reset-apply"' + (ok ? '' : ' disabled') + '>' + icon('trash') + 'Удалить все данные</button><button class="btn" data-action="close-sheet">Отмена</button></div>';
  }

  function renderSheet() {
    const key = sheetKind ? sheetKind + (ds ? ds.date : '') + (fu ? fu.date : '') + sheetRev : '';
    if (key === renderedSheetKey) return;
    renderedSheetKey = key;
    if (!sheetKind) {
      els.overlay.innerHTML = '';
      document.body.style.overflow = '';
      if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* фокус недоступен */ } }
      return;
    }
    let inner = '';
    if (sheetKind === 'day' && ds) inner = daySheetHtml(C);
    else if (sheetKind === 'fuel' && fu) inner = fuelSheetHtml(C);
    else if (sheetKind === 'import' && imp) inner = importSheetHtml();
    else if (sheetKind === 'export' && exp) inner = exportSheetHtml();
    else if (sheetKind === 'reset' && rst) inner = resetSheetHtml();
    els.overlay.innerHTML = '<div class="overlay" data-action="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' + inner + '</div></div>';
    document.body.style.overflow = 'hidden';
    if (sheetKind === 'day') {
      updateDayLive();
      const a = $('#amt');
      if (a) { try { a.focus({ preventScroll: true }); a.setSelectionRange(a.value.length, a.value.length); } catch (e) { /* без фокуса */ } }
    }
    if (sheetKind === 'fuel' && fu) {
      updateFuelLive();
      const fa = $('#f-amt');
      if (fa && !fu.noFocus) { try { fa.focus({ preventScroll: true }); } catch (e) { /* без фокуса */ } }
    }
  }

  /* ---------- поздравления ---------- */
  function burst() {
    if (reduceMotion() || !prefs.celebrate) return;
    const cv = document.createElement('canvas');
    cv.id = 'fx';
    document.body.appendChild(cv);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = (cv.width = Math.round(window.innerWidth * dpr));
    const H = (cv.height = Math.round(window.innerHeight * dpr));
    const x = cv.getContext('2d');
    const colors = [col('--accent'), col('--accent-2'), col('--amber'), col('--text')];
    const ps = [];
    for (let i = 0; i < 46; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.1;
      const s = (5 + Math.random() * 8) * dpr;
      ps.push({ x: W / 2, y: H * 0.42, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: (3 + Math.random() * 4) * dpr, h: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35, c: colors[i % colors.length], life: 0 });
    }
    let frame = 0;
    (function tick() {
      frame++;
      x.clearRect(0, 0, W, H);
      ps.forEach((p) => {
        p.vy += 0.24 * dpr; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        const alpha = Math.max(0, 1 - frame / 105);
        x.save(); x.globalAlpha = alpha; x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
      });
      if (frame < 110) requestAnimationFrame(tick); else cv.remove();
    })();
  }

  let celeTimer = null;
  function celebrate(fb, badges, particles) {
    clearTimeout(celeTimer);
    const b = badges.map((a) => '<div class="cele-badge">' + icon(a.icon, 20) + '<span>' + esc(G.ACH_MESSAGES[a.id]) + '</span></div>').join('');
    els.cele.innerHTML = '<div class="cele ' + fb.level + '" data-action="cele-close" role="dialog" aria-modal="true" aria-label="Поздравление"><div class="cele-card">' +
      '<div class="cele-ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="34"/><path d="M24 39l10 10 19-21"/></svg></div>' +
      '<h2>' + esc(fb.title) + '</h2><p>' + esc(fb.text) + '</p>' + (b ? '<div class="cele-badges">' + b + '</div>' : '') +
      '<button class="btn primary block" data-action="cele-close">Продолжить</button></div></div>';
    if (particles) burst();
    celeTimer = setTimeout(closeCele, 7000);
  }
  function closeCele() { clearTimeout(celeTimer); els.cele.innerHTML = ''; }

  /* ---------- действия ---------- */
  function openSheetHash(hash) {
    lastFocus = document.activeElement;
    sheetPushed = true;
    location.hash = hash;
  }
  function closeSheet() {
    if (!sheetKind) return;
    sheetKind = null; ds = null; imp = null; exp = null; rst = null; fu = null;
    if (sheetPushed) { sheetPushed = false; history.back(); } else { try { location.replace('#' + tab); } catch (e) { /* без изменения адреса */ } }
    render();
  }
  function openDay(date) {
    if (!G.isInPeriod(date)) return;
    openDayState(date);
    sheetKind = 'day';
    sheetRev++;
    openSheetHash('day-' + date);
    render();
  }

  function openFuel(date) {
    if (!G.isInPeriod(date)) return;
    openFuelState(date);
    sheetKind = 'fuel';
    sheetRev++;
    openSheetHash('fuel-' + date);
    render();
  }
  // переключение между окном дня и окном заправок без новой записи в истории
  function switchSheet(kind, date) {
    if (!G.isInPeriod(date)) return;
    if (kind === 'fuel') { ds = null; openFuelState(date); sheetKind = 'fuel'; }
    else { fu = null; openDayState(date); sheetKind = 'day'; }
    sheetRev++;
    location.replace('#' + kind + '-' + date);
    render();
  }

  function saveDay() {
    const p = G.parseAmount(ds.value);
    if (!p.ok) {
      ds.error = G.AMOUNT_ERRORS[p.error];
      updateDayLive();
      const a = $('#amt'); if (a) a.focus();
      buzz(40);
      return;
    }
    const date = ds.date;
    const old = state.days[date] || null;
    const note = ds.note.trim().slice(0, G.CFG.noteMax);
    const unchanged = old && G.kop(old.amount) === G.kop(p.value);
    if (unchanged && (old.note || '') === note) { closeSheet(); toast('Без изменений'); return; }
    state.days[date] = { amount: p.value, note, ts: new Date().toISOString() };
    const after = G.compute(state, today);
    const fresh = after.achievements.filter((a) => a.unlocked && !state.meta.celebrated[a.id]);
    fresh.forEach((a) => { state.meta.celebrated[a.id] = true; });
    persist();
    C = after;
    buzz(18);
    closeSheet();
    if (unchanged) { toast('Комментарий сохранён'); return; }
    const fb = G.dayFeedback(G.kop(p.value), date === today);
    if (prefs.celebrate && (fresh.length || fb.level === 'over' || fb.level === 'done')) {
      celebrate(fb, fresh, fb.level === 'over' || fresh.length > 0);
    } else if (fresh.length) {
      toast(G.ACH_MESSAGES[fresh[0].id]);
    } else {
      toast(fb.title);
    }
  }

  function clearDay() {
    if (!ds.confirmClear) {
      ds.confirmClear = true; sheetRev++; renderedSheetKey = ''; renderSheet();
      clearTimeout(clearDay.t);
      clearDay.t = setTimeout(() => { if (ds) { ds.confirmClear = false; sheetRev++; renderSheet(); } }, 4000);
      return;
    }
    delete state.days[ds.date];
    persist();
    closeSheet();
    toast('День очищен');
  }

  function snapshotUndo(reason) {
    sset(UNDO_KEY, JSON.stringify({ reason, at: new Date().toISOString(), data: G.exportData(state) }));
  }
  function readUndo() {
    try {
      const u = JSON.parse(sget(UNDO_KEY) || 'null');
      return u && u.data && u.at ? u : null;
    } catch (e) { return null; }
  }

  function exportText() { return JSON.stringify(G.exportData(state), null, 2); }
  function markExported() { state.meta.lastExport = new Date().toISOString(); persist(); }

  function exportFile() {
    const text = exportText();
    try {
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'moya-cel-' + today + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      markExported();
      toast('Копия отправлена в загрузки. Если файл не появился, нажмите «Скопировать».');
    } catch (e) {
      toast('Не удалось создать файл. Нажмите «Скопировать».', 'bad');
    }
    render();
  }
  function exportCopy() {
    const text = exportText();
    const fallback = () => {
      exp = { text };
      if (sheetKind) { sheetKind = 'export'; sheetRev++; render(); } else { sheetKind = 'export'; sheetRev++; openSheetHash('export-data'); render(); }
    };
    try {
      navigator.clipboard.writeText(text).then(() => { markExported(); toast('Копия скопирована. Сохраните её в надёжном месте.'); render(); }, fallback);
    } catch (e) { fallback(); }
  }

  function importCheck() {
    imp.result = G.parseImport(imp.text);
    sheetRev++; renderedSheetKey = ''; renderSheet();
  }
  function importApply() {
    if (!imp || !imp.result || !imp.result.ok) return;
    snapshotUndo('import');
    const next = imp.result.state;
    if (!imp.result.hasFuel) next.fuel = state.fuel; // копия из старой версии: заправки не стираем
    const tmp = G.compute(next, today);
    tmp.achievements.forEach((a) => { if (a.unlocked) next.meta.celebrated[a.id] = true; });
    next.meta.lastExport = state.meta.lastExport;
    state = next;
    persist();
    closeSheet();
    toast('Данные восстановлены из копии');
  }
  function resetApply() {
    if (!rst || rst.word.trim().toUpperCase() !== 'СБРОС') return;
    snapshotUndo('reset');
    state = G.emptyState();
    persist();
    closeSheet();
    toast('Все данные сброшены');
  }
  function undoRestore() {
    const u = readUndo();
    if (!u) return;
    const r = G.parseImport(JSON.stringify(u.data));
    if (!r.ok) { toast('Не удалось вернуть данные', 'bad'); return; }
    const tmp = G.compute(r.state, today);
    tmp.achievements.forEach((a) => { if (a.unlocked) r.state.meta.celebrated[a.id] = true; });
    r.state.meta.lastExport = state.meta.lastExport;
    state = r.state;
    persist();
    sdel(UNDO_KEY);
    render();
    toast('Данные возвращены');
  }

  /* ---------- вывод ---------- */
  function buildNav() {
    els.nav.innerHTML = TABS.map((t) => '<button class="nav-btn" data-action="goto" data-tab="' + t.id + '" data-id="' + t.id + '"><span class="ico">' + icon(t.icon, 22) + '</span><span>' + t.label + '</span></button>').join('');
  }
  function updateNav() {
    els.nav.querySelectorAll('.nav-btn').forEach((b) => {
      if (b.dataset.id === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  function animateNumbers() {
    els.view.querySelectorAll('[data-count]').forEach((el) => {
      const to = parseFloat(el.dataset.count);
      const key = el.dataset.key;
      const fmt = el.dataset.fmt;
      const f = (v) => (fmt === 'signed' ? G.fmtSigned(v) : G.fmtRub(v));
      const from = key in prevVals ? prevVals[key] : 0;
      prevVals[key] = to;
      if (from === to || reduceMotion() || document.hidden) { el.textContent = f(to); return; }
      const t0 = performance.now();
      const dur = 750;
      (function step(now) {
        const k = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);
        el.textContent = f(k >= 1 ? to : from + (to - from) * e);
        if (k < 1 && document.contains(el)) requestAnimationFrame(step);
      })(t0);
    });
  }

  function afterPaint() {
    const apply = () => {
      els.view.querySelectorAll('[data-offset]').forEach((el) => { el.style.strokeDashoffset = el.dataset.offset; });
      els.view.querySelectorAll('.track > i[data-w]').forEach((el) => { el.style.width = el.dataset.w + '%'; });
    };
    if (document.hidden) apply(); else requestAnimationFrame(() => requestAnimationFrame(apply));
  }

  function render() {
    try {
      C = G.compute(state, today);
      const changed = lastTab !== tab;
      const y = window.scrollY;
      const html = tab === 'calendar' ? viewCalendar(C) : tab === 'weeks' ? viewWeeks(C) : tab === 'stats' ? viewStats(C) : tab === 'options' ? viewOptions(C) : viewHome(C);
      els.view.innerHTML = html;
      const v = els.view.firstElementChild;
      if (v) { v.className = 'view' + (changed ? '' : ' still'); }
      updateNav();
      afterPaint();
      animateNumbers();
      fitCells();
      drawCharts(C);
      if (changed) { window.scrollTo(0, 0); } else { window.scrollTo(0, y); }
      lastTab = tab;
      renderSheet();
    } catch (e) {
      if (window.console) console.error(e);
      els.view.innerHTML = '<div class="card"><h2>Что-то пошло не так</h2><p class="muted" style="margin:8px 0 14px">Ваши записи не потеряны: они лежат в памяти браузера. Обновите страницу.</p><button class="btn primary" onclick="location.reload()">Обновить</button></div>';
    }
  }

  /* ---------- маршрутизация по hash ---------- */
  function onHash() {
    const h = location.hash.replace(/^#/, '');
    let m;
    if ((m = /^day-(\d{4}-\d{2}-\d{2})$/.exec(h)) && G.isInPeriod(m[1])) {
      if (!ds || ds.date !== m[1] || sheetKind !== 'day') { openDayState(m[1]); sheetRev++; }
      sheetKind = 'day';
    } else if ((m = /^fuel-(\d{4}-\d{2}-\d{2})$/.exec(h)) && G.isInPeriod(m[1])) {
      if (!fu || fu.date !== m[1] || sheetKind !== 'fuel') { openFuelState(m[1]); sheetRev++; }
      sheetKind = 'fuel';
    } else if (h === 'import-data') {
      if (!imp) imp = { text: '', result: null };
      sheetKind = 'import';
    } else if (h === 'export-data' && exp) {
      sheetKind = 'export';
    } else if (h === 'reset-data') {
      if (!rst) rst = { word: '' };
      sheetKind = 'reset';
    } else {
      sheetKind = null; sheetPushed = false; ds = null; imp = null; exp = null; rst = null; fu = null;
      if (TABS.some((t) => t.id === h)) tab = h;
    }
    render();
  }

  /* ---------- события ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    if (a === 'backdrop') { if (e.target === el) closeSheet(); return; }
    if (a === 'cele-close') { if (el.classList.contains('cele') && e.target !== el) return; closeCele(); return; }
    switch (a) {
      case 'goto': {
        const t = el.dataset.tab;
        if (t === tab && !sheetKind) { window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); break; }
        tab = t;
        if (location.hash.replace('#', '') === t) render(); else location.hash = t;
        break;
      }
      case 'open-day': openDay(el.dataset.date); break;
      case 'day-nav': if (el.dataset.date) { openDayState(el.dataset.date); sheetRev++; location.replace('#day-' + el.dataset.date); render(); } break;
      case 'close-sheet': closeSheet(); break;
      case 'chip': {
        if (!ds) break;
        ds.value = el.dataset.val; ds.error = '';
        const inp = $('#amt'); if (inp) inp.value = ds.value;
        updateDayLive();
        break;
      }
      case 'clear-day': clearDay(); break;
      case 'open-fuel': openFuel(el.dataset.date); break;
      case 'to-fuel': switchSheet('fuel', el.dataset.date); break;
      case 'to-day': switchSheet('day', el.dataset.date); break;
      case 'fuel-nav': if (el.dataset.date) switchSheet('fuel', el.dataset.date); break;
      case 'fuel-chip': { if (!fu) break; fu.amount = el.dataset.val; fu.error = ''; const fi = $('#f-amt'); if (fi) fi.value = fu.amount; updateFuelLive(); break; }
      case 'fuel-edit': editFuel(el.dataset.id); break;
      case 'fuel-del': deleteFuel(el.dataset.id, el); break;
      case 'fuel-cancel': cancelFuelEdit(); break;
      case 'weeks-mode': weeksMode = el.dataset.mode; render(); break;
      case 'theme': prefs.theme = el.dataset.themeId; savePrefs(); applyTheme(); render(); break;
      case 'toggle-celebrate': prefs.celebrate = !prefs.celebrate; savePrefs(); render(); break;
      case 'export-file': exportFile(); break;
      case 'export-copy': exportCopy(); break;
      case 'export-select': { const t = $('#exp-text'); if (t) { t.focus(); t.select(); } break; }
      case 'open-import': imp = { text: '', result: null }; sheetKind = 'import'; sheetRev++; openSheetHash('import-data'); render(); break;
      case 'import-check': importCheck(); break;
      case 'import-apply': importApply(); break;
      case 'open-reset': rst = { word: '' }; sheetKind = 'reset'; sheetRev++; openSheetHash('reset-data'); render(); break;
      case 'reset-apply': resetApply(); break;
      case 'undo-restore': undoRestore(); break;
      default: break;
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target && e.target.id === 'day-form') { e.preventDefault(); saveDay(); }
    else if (e.target && e.target.id === 'fuel-form') { e.preventDefault(); if (fu) saveFuel(); }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'amt' && ds) { ds.value = t.value; ds.error = ''; updateDayLive(); }
    else if (t.id === 'note' && ds) { ds.note = t.value; const n = $('#note-count'); if (n) n.textContent = t.value.length + '/' + G.CFG.noteMax; }
    else if ((t.id === 'f-amt' || t.id === 'f-lit' || t.id === 'f-note') && fu) {
      if (t.id === 'f-amt') fu.amount = t.value; else if (t.id === 'f-lit') fu.liters = t.value; else fu.note = t.value;
      fu.error = ''; updateFuelLive();
    }
    else if (t.id === 'imp-text' && imp) {
      imp.text = t.value; imp.result = null;
      const go = $('[data-action="import-check"], [data-action="import-apply"]');
      if (go) { go.setAttribute('data-action', 'import-check'); go.textContent = 'Проверить копию'; go.disabled = !imp.text.trim(); }
      const note = els.overlay.querySelector('.notice'); if (note) note.remove();
    } else if (t.id === 'reset-word' && rst) {
      rst.word = t.value;
      const go = $('#reset-go'); if (go) go.disabled = rst.word.trim().toUpperCase() !== 'СБРОС';
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'imp-file' && imp && e.target.files && e.target.files[0]) {
      const f = e.target.files[0];
      if (f.size > 2 * 1024 * 1024) { imp.result = { ok: false, error: 'Файл слишком большой для резервной копии.' }; sheetRev++; renderedSheetKey = ''; renderSheet(); return; }
      const rd = new FileReader();
      rd.onload = () => { imp.text = String(rd.result || ''); importCheck(); };
      rd.onerror = () => { imp.result = { ok: false, error: 'Не удалось прочитать файл.' }; sheetRev++; renderedSheetKey = ''; renderSheet(); };
      rd.readAsText(f);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (els.cele.firstChild) closeCele(); else if (sheetKind) closeSheet(); }
  });

  window.addEventListener('hashchange', onHash);
  window.addEventListener('storage', (e) => { if (e.key === KEY) { state = loadState(); render(); } });
  window.addEventListener('error', () => { /* ошибки рисования не должны ронять данные */ });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', () => { applyTheme(); render(); });
  }

  function checkDay() {
    const t = G.todayStr();
    if (t !== today) { today = t; render(); }
  }
  setInterval(checkDay, 20000);

  /* ---------- запуск ---------- */
  function init() {
    applyTheme();
    buildNav();
    const h = location.hash.replace(/^#/, '');
    if (TABS.some((t) => t.id === h)) tab = h;
    onHash();
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) { /* не критично */ } }
  }
  init();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}), { once: true });
  }
})();

</script>
</body>
</html>
