/* Раскладка: одна колонка на телефоне, нижняя навигация; от 960px навигация уходит в боковую рейку, карточки в две колонки. */
:root {
  --bg: #0c0f12;
  --bg-glow: rgba(45, 212, 168, 0.07);
  --surface: #13181d;
  --surface-2: #1a2026;
  --surface-3: #232a31;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.13);
  --text: #edf1f4;
  --text-2: #a4aeb7;
  --text-3: #707b85;
  --accent: #2dd4a8;
  --accent-2: #7ee8cf;
  --accent-ink: #05231c;
  --accent-soft: rgba(45, 212, 168, 0.13);
  --amber: #f3b544;
  --amber-soft: rgba(243, 181, 68, 0.14);
  --red: #ef6670;
  --red-soft: rgba(239, 102, 112, 0.14);
  --fuel: #ff9a5c;
  --fuel-soft: rgba(255, 154, 92, 0.13);
  --fuel-line: rgba(255, 154, 92, 0.38);
  --idle: #38424b;
  --idle-soft: rgba(255, 255, 255, 0.045);
  --grid: rgba(255, 255, 255, 0.06);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --overlay: rgba(4, 6, 8, 0.66);
  --nav-bg: rgba(14, 18, 22, 0.88);
  --nav-h: 64px;
  --font-display: 'Manrope', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r-card: 20px;
  --r-ctl: 14px;
  color-scheme: dark;
}
:root[data-app-theme='light'] {
  --bg: #f2f5f6; --bg-glow: rgba(8, 122, 95, 0.09); --surface: #ffffff; --surface-2: #f0f3f5; --surface-3: #e2e8ec;
  --line: rgba(15, 26, 34, 0.09); --line-2: rgba(15, 26, 34, 0.17);
  --text: #0f1a22; --text-2: #44515c; --text-3: #667380;
  --accent: #087a5f; --accent-2: #12a37f; --accent-ink: #ffffff; --accent-soft: rgba(8, 122, 95, 0.12);
  --amber: #a46500; --amber-soft: rgba(214, 140, 0, 0.11); --red: #c42f3c; --red-soft: rgba(196, 47, 60, 0.11);
  --fuel: #b24d0a; --fuel-soft: rgba(224, 110, 30, 0.12); --fuel-line: rgba(178, 77, 10, 0.36);
  --idle: #c3ccd3; --idle-soft: rgba(15, 26, 34, 0.045); --grid: rgba(15, 26, 34, 0.08);
  --shadow: 0 18px 50px rgba(15, 26, 34, 0.18); --overlay: rgba(15, 26, 34, 0.46); --nav-bg: rgba(255, 255, 255, 0.9);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-app-theme='auto'] {
    --bg: #f2f5f6; --bg-glow: rgba(8, 122, 95, 0.09); --surface: #ffffff; --surface-2: #f0f3f5; --surface-3: #e2e8ec;
    --line: rgba(15, 26, 34, 0.09); --line-2: rgba(15, 26, 34, 0.17);
    --text: #0f1a22; --text-2: #44515c; --text-3: #667380;
    --accent: #087a5f; --accent-2: #12a37f; --accent-ink: #ffffff; --accent-soft: rgba(8, 122, 95, 0.12);
    --amber: #a46500; --amber-soft: rgba(214, 140, 0, 0.11); --red: #c42f3c; --red-soft: rgba(196, 47, 60, 0.11);
  --fuel: #b24d0a; --fuel-soft: rgba(224, 110, 30, 0.12); --fuel-line: rgba(178, 77, 10, 0.36);
    --idle: #c3ccd3; --idle-soft: rgba(15, 26, 34, 0.045); --grid: rgba(15, 26, 34, 0.08);
    --shadow: 0 18px 50px rgba(15, 26, 34, 0.18); --overlay: rgba(15, 26, 34, 0.46); --nav-bg: rgba(255, 255, 255, 0.9);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(900px 420px at 12% -6%, var(--bg-glow), transparent 70%);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums lining-nums; font-feature-settings: 'tnum' 1, 'lnum' 1; letter-spacing: -0.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- оболочка ---------- */
.app { position: relative; z-index: 1; }
.main {
  max-width: 760px; margin: 0 auto;
  padding-block: 18px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.view { display: flex; flex-direction: column; gap: 14px; animation: rise 0.34s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* ---------- навигация ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around; gap: 2px;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  border-top: 1px solid var(--line);
}
.nav-btn {
  flex: 1; max-width: 120px; min-height: 52px; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
  transition: color 0.2s;
}
.nav-btn .ico { width: 44px; height: 28px; border-radius: 14px; display: grid; place-items: center; transition: background 0.25s, transform 0.25s; }
.nav-btn[aria-current='page'] { color: var(--accent); }
.nav-btn[aria-current='page'] .ico { background: var(--accent-soft); }
.nav-btn:active .ico { transform: scale(0.92); }

/* ---------- заголовок ---------- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 2px 2px 4px; }
.brand { min-width: 0; }
.brand h1 { font: 800 21px/1.1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.brand p { color: var(--text-2); font-size: 13px; margin-top: 5px; }
.date-line { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.streak {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  padding: 7px 12px 7px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; font-weight: 600;
}
.streak b { font: 800 16px/1 var(--font-display); color: var(--text); }
.streak.hot { color: var(--amber); border-color: rgba(243, 181, 68, 0.28); background: var(--amber-soft); }
.streak.hot b { color: var(--amber); }
.screen-title { font: 800 24px/1.15 var(--font-display); letter-spacing: -0.01em; }
.screen-sub { color: var(--text-2); font-size: 13.5px; margin-top: 4px; }
.head { padding: 2px 2px 2px; }

/* ---------- карточки ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; min-width: 0; }
.card.pad-s { padding: 14px; }
.card h2, .card-title { font: 700 14px/1.2 var(--font-display); letter-spacing: 0.01em; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.small { font-size: 12.5px; }

.hero { padding: 20px 18px 16px; position: relative; overflow: hidden; }
.hero::before {
  content: ''; position: absolute; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft), transparent 68%); pointer-events: none;
}
.ring-wrap { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 2px auto 0; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 14; }
.ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(0.22, 0.8, 0.2, 1); filter: drop-shadow(0 0 10px var(--accent-soft)); }
.ring-mark { fill: var(--bg); stroke: var(--text); stroke-width: 2.5; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16%; gap: 2px; }
.ring-center .big { font: 800 clamp(30px, 9.5vw, 42px)/1.05 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ring-center .of { font-size: 13px; color: var(--text-2); }
.hero-line { text-align: center; font-size: 14px; color: var(--text-2); margin-top: 6px; min-height: 20px; }
.legend-line { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); margin-top: 10px; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.triple { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.triple > div { min-width: 0; }
.triple .v { font: 800 clamp(13.5px, 4.1vw, 16px)/1.2 var(--font-display); margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.triple > div + div { padding-left: 10px; border-left: 1px solid var(--line); }

.today-card { display: flex; flex-direction: column; gap: 12px; }
.today-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.today-row .big { font: 800 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--idle-soft); color: var(--text-2); white-space: nowrap; }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.pill.partial { background: var(--amber-soft); color: var(--amber); }
.pill.zero { background: var(--red-soft); color: var(--red); }
.pill.empty { background: var(--idle-soft); color: var(--text-2); }

.btn {
  min-height: 50px; padding: 0 18px; border-radius: var(--r-ctl);
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-weight: 700; font-size: 15px; letter-spacing: 0.005em;
  background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text);
  transition: transform 0.12s, background 0.2s, border-color 0.2s, opacity 0.2s;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:active { background: var(--accent-2); }
.btn.danger { background: var(--red-soft); color: var(--red); border-color: rgba(239, 102, 112, 0.35); }
.btn.danger.solid { background: var(--red); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.42; pointer-events: none; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 13.5px; border-radius: 12px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 150px; }

.notice { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 16px; background: var(--amber-soft); border: 1px solid rgba(243, 181, 68, 0.28); color: var(--text); font-size: 13.5px; }
.notice svg { color: var(--amber); margin-top: 1px; }
.notice.info { background: var(--accent-soft); border-color: rgba(45, 212, 168, 0.25); }
.notice.info svg { color: var(--accent); }
.notice.bad { background: var(--red-soft); border-color: rgba(239, 102, 112, 0.3); }
.notice.bad svg { color: var(--red); }
.notice .grow { flex: 1; min-width: 0; }
.link-btn { color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 2px 0; text-align: left; }

/* запас относительно плана */
.reserve-val { font: 800 34px/1.05 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.reserve-val.pos { color: var(--accent); } .reserve-val.neg { color: var(--red); }
.bars { display: grid; gap: 9px; margin-top: 14px; }
.bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-2); }
.bar-row .v { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.track { height: 9px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 6px; background: var(--accent); transition: width 0.9s cubic-bezier(0.22, 0.8, 0.2, 1); width: 0; }
.track > i.plan { background: var(--text-3); opacity: 0.7; }
.track > i.amber { background: var(--amber); } .track > i.red { background: var(--red); }

/* плитки показателей */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tile .k { display: flex; align-items: center; gap: 7px; color: var(--text-3); font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; }
.tile .k svg { color: var(--text-3); }
.tile .v { font: 800 clamp(18px, 5.4vw, 22px)/1.15 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.015em; white-space: nowrap; margin-top: 4px; }
.tile .s { font-size: 12px; color: var(--text-2); }
.tile.wide { grid-column: 1 / -1; }
.v.pos { color: var(--accent); } .v.neg { color: var(--red); }

/* достижения */
.ach-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ach { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.ach .ach-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-3); }
.ach.on { border-color: rgba(45, 212, 168, 0.35); background: linear-gradient(160deg, var(--accent-soft), transparent 70%), var(--surface-2); }
.ach.on .ach-ico { background: var(--accent); color: var(--accent-ink); }
.ach .t { font-size: 13px; font-weight: 700; line-height: 1.25; }
.ach .h { font-size: 11.5px; color: var(--text-3); }
.ach.on .h { color: var(--accent); }
.ach .track { height: 5px; }

/* ---------- календарь ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.month-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.month-head h2 { font: 800 18px/1.2 var(--font-display); }
.month-head .sum { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; text-align: right; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wd { text-align: center; font-size: 10.5px; font-weight: 700; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; padding-bottom: 3px; }
.cell {
  position: relative; aspect-ratio: 1 / 1.22; border-radius: 12px; padding: 5px 4px 4px;
  display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-width: 0;
  background: var(--idle-soft); border: 1px solid transparent; color: var(--text);
  transition: transform 0.12s, border-color 0.2s;
}
.cell:active { transform: scale(0.95); }
.cell .d { font: 700 12px/1 var(--font-display); }
.cell .f { font: 800 11px/1.1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; white-space: nowrap; }
.cell .f.long { font-size: 9px; letter-spacing: -0.04em; }
.cell .f sup { font-size: 0.62em; line-height: 0; vertical-align: baseline; position: relative; top: -0.5em; margin-left: 1px; letter-spacing: 0; font-weight: 700; }
.cell .p { font-size: 8.5px; line-height: 1; color: var(--text-3); white-space: nowrap; }
.cell .st { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
.cell.done { background: var(--accent-soft); border-color: rgba(45, 212, 168, 0.28); } .cell.done .st { background: var(--accent); }
.cell.partial { background: var(--amber-soft); border-color: rgba(243, 181, 68, 0.28); } .cell.partial .st { background: var(--amber); }
.cell.zero { background: var(--red-soft); border-color: rgba(239, 102, 112, 0.28); } .cell.zero .st { background: var(--red); }
.cell.empty.past { border-color: var(--line-2); border-style: dashed; }
.cell.future { opacity: 0.5; }
.cell.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px var(--accent-soft); opacity: 1; }
.cell.blank { visibility: hidden; pointer-events: none; }
.pw { display: none; }
.view.still { animation: none; }

/* ---------- недели и периоды ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.seg button { min-height: 42px; border-radius: 12px; font-weight: 700; font-size: 13.5px; color: var(--text-2); transition: background 0.2s, color 0.2s; padding: 0 8px; }
.seg button[aria-pressed='true'], .seg button[aria-checked='true'] { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 0 var(--line-2) inset; }
.chart-box { position: relative; height: 230px; }
.chart-box.tall { height: 270px; }
.chart-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--text-3); font-size: 13px; padding: 0 20px; }
.list { display: flex; flex-direction: column; gap: 12px; }
.wk { display: flex; flex-direction: column; gap: 12px; }
.wk-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.wk-top .t { font: 800 16px/1.2 var(--font-display); }
.wk-top .r { color: var(--text-2); font-size: 12.5px; margin-top: 3px; }
.wk-main { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.wk-main .big { font: 800 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.wk-main .of { color: var(--text-2); font-size: 13px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv > div { min-width: 0; }
.kv .v { font: 700 clamp(12.5px, 3.8vw, 14.5px)/1.25 var(--font-display); margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.strip.p14 { grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; }
.strip i { height: 8px; border-radius: 4px; background: var(--idle); display: block; }
.strip i.done { background: var(--accent); } .strip i.partial { background: var(--amber); } .strip i.zero { background: var(--red); }
.strip i.empty { background: var(--idle-soft); box-shadow: inset 0 0 0 1px var(--line-2); } .strip i.today { box-shadow: 0 0 0 2px var(--text-3); }

/* ---------- статистика ---------- */
.stat-chart .note { font-size: 12.5px; color: var(--text-2); margin-top: 12px; }
.mini-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
.mini-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mini-legend .ln { width: 14px; height: 0; border-top: 2px solid currentColor; display: inline-block; }
.mini-legend .ln.dash { border-top-style: dashed; }

/* ---------- настройки ---------- */
.set-group { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.row .lbl { min-width: 0; }
.row .lbl b { display: block; font-size: 14.5px; font-weight: 600; }
.row .lbl span { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); position: relative; flex: none; transition: background 0.2s; border: 1px solid var(--line-2); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text-2); transition: transform 0.22s, background 0.2s; }
.switch[aria-checked='true'] { background: var(--accent); border-color: transparent; }
.switch[aria-checked='true']::after { transform: translateX(20px); background: var(--accent-ink); }
.facts { display: grid; gap: 8px; font-size: 13.5px; }
.facts > div { display: flex; justify-content: space-between; gap: 12px; }
.facts span:first-child { color: var(--text-2); }
.facts span:last-child { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
details.rules summary { cursor: pointer; font-weight: 600; font-size: 14.5px; list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary svg { transition: transform 0.2s; color: var(--text-3); }
details.rules[open] summary svg { transform: rotate(90deg); }
details.rules ul { margin: 12px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13.5px; display: grid; gap: 8px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 2px 0; }
.txt-area { width: 100%; min-height: 110px; resize: vertical; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--bg); border: 1px solid var(--line-2); color: var(--text); font-size: 14px; line-height: 1.4; }
.txt-area.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.txt-area:focus, .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- окна ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: var(--overlay); animation: fade 0.22s both; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: min(100%, 520px); max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  box-shadow: var(--shadow); animation: slide 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slide { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 4px; border-radius: 3px; background: var(--line-2); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sheet-head h2 { font: 800 19px/1.2 var(--font-display); }
.sheet-head .sub { color: var(--text-2); font-size: 13px; margin-top: 4px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.icon-btn[disabled] { opacity: 0.3; pointer-events: none; }
.head-actions { display: flex; gap: 6px; }
.amount-box { position: relative; margin: 6px 0 10px; }
.field {
  width: 100%; min-height: 64px; padding: 0 56px 0 18px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line-2);
  font: 800 32px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.field.err { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.field-unit { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 700 22px/1 var(--font-display); color: var(--text-3); pointer-events: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); font-weight: 600; font-size: 13.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.chip:active { background: var(--surface-3); }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.live { min-height: 22px; font-size: 13.5px; margin-bottom: 12px; color: var(--text-2); }
.live.pos { color: var(--accent); } .live.neg { color: var(--amber); }
.err-msg { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
.label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin: 4px 0 7px; }
.sheet .btn-row { margin-top: 14px; }
.locked { text-align: center; padding: 18px 8px 8px; color: var(--text-2); }
.locked svg { margin: 0 auto 10px; color: var(--text-3); }
.confirm-input { margin: 12px 0 4px; min-height: 52px; font-size: 18px; padding: 0 16px; border-radius: var(--r-ctl); width: 100%; background: var(--bg); border: 1px solid var(--line-2); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }

.cele {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px;
  background: var(--overlay); animation: fade 0.25s both; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.cele-card { width: min(100%, 360px); text-align: center; padding: 26px 22px 22px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: pop 0.5s cubic-bezier(0.2, 1.1, 0.3, 1) both; position: relative; overflow: hidden; }
.cele-card::before { content: ''; position: absolute; inset: -30% -10% auto; height: 70%; background: radial-gradient(closest-side, var(--accent-soft), transparent); pointer-events: none; }
@keyframes pop { from { transform: scale(0.88) translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.cele-ring { width: 76px; height: 76px; margin: 0 auto 14px; position: relative; }
.cele-ring svg { width: 100%; height: 100%; }
.cele-ring circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 214; stroke-dashoffset: 214; animation: draw 0.8s 0.12s ease-out forwards; }
.cele-ring path { fill: none; stroke: var(--accent); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.45s 0.7s ease-out forwards; }
.cele.partial .cele-ring circle, .cele.partial .cele-ring path { stroke: var(--amber); }
.cele.zero .cele-ring circle, .cele.zero .cele-ring path { stroke: var(--text-3); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cele-card h2 { font: 800 21px/1.25 var(--font-display); text-wrap: balance; position: relative; }
.cele-card p { color: var(--text-2); font-size: 14px; margin-top: 8px; position: relative; text-wrap: balance; }
.cele-badges { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; position: relative; }
.cele-badge { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13.5px; animation: pop 0.5s 0.5s cubic-bezier(0.2, 1.1, 0.3, 1) both; }
.cele-card .btn { margin-top: 18px; position: relative; }
#fx { position: fixed; inset: 0; z-index: 61; pointer-events: none; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; max-width: 440px; padding: 12px 16px; border-radius: 14px; background: var(--surface-3); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 14px; font-weight: 500; animation: rise 0.28s both; display: flex; gap: 10px; align-items: center; }
.toast.bad { border-color: rgba(239, 102, 112, 0.5); }
.toast svg { color: var(--accent); } .toast.bad svg { color: var(--red); }

/* ---------- адаптив ---------- */
@media (min-width: 420px) {
  .cell .p { font-size: 9px; }
}
@media (min-width: 640px) {
  .main { max-width: 860px; padding-top: 28px; }
  .view { gap: 16px; }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ach-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cell { aspect-ratio: 1 / 0.95; padding: 8px 8px 7px; border-radius: 14px; }
  .cell .d { font-size: 14px; }
  .cell .f { font-size: 15px; letter-spacing: -0.02em; }
  .cell .f.long { font-size: 12.5px; }
  .cell .p { font-size: 11px; }
  .cell .st { top: 9px; right: 9px; width: 8px; height: 8px; }
  .cal-grid { gap: 8px; }
  .pw { display: inline; }
  .overlay { align-items: center; }
  .sheet { border-radius: 26px; border-bottom: 1px solid var(--line-2); max-height: 90%; }
  .chart-box { height: 270px; }
}
@media (min-width: 960px) {
  .main { max-width: 1160px; padding-left: max(120px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-bottom: 48px; }
  .nav {
    right: auto; top: 0; width: 92px; flex-direction: column; justify-content: flex-start; gap: 8px;
    padding: 28px 10px 20px; border-top: 0; border-right: 1px solid var(--line);
  }
  .nav-btn { flex: none; max-width: none; width: 100%; min-height: 66px; }
  .cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .cols.two-wide { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; }
  .col { gap: 16px; }
  .toasts { bottom: 24px; left: 92px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell { aspect-ratio: 1 / 1.05; padding: 7px 6px 6px; }
  .cell .f { font-size: 13.5px; }
  .cell .f.long { font-size: 10.5px; }
  .cell .p { font-size: 10px; }
  .pw { display: none; }
  .chart-box { height: 290px; }
  .ring-wrap { width: min(100%, 300px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
noscript { display: block; padding: 24px; text-align: center; color: var(--text-2); }

/* ---------- заправка ---------- */
.btn.fuel { background: var(--fuel-soft); color: var(--fuel); border-color: var(--fuel-line); }
.btn.fuel:active { background: var(--fuel-line); }
.btn-row .btn.fix { flex: 0 0 auto; }
.fuel-ico { color: var(--fuel); }
.cell .fu { position: absolute; right: 4px; bottom: 4px; color: var(--fuel); line-height: 0; display: block; }
.legend .lg-fuel { color: var(--text-2); }
.legend .lg-fuel svg { color: var(--fuel); }
.fuel-line { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fuel); font-weight: 600; }
.fuel-net { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); }
.fuel-net b { color: var(--text); font-size: 16px; white-space: nowrap; }
.fuel-list { display: flex; flex-direction: column; margin-top: 12px; }
.fuel-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.fuel-row .fr-d { color: var(--text-2); font-weight: 600; white-space: nowrap; }
.fuel-row .fr-m { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fuel-row .fr-a { font-size: 14px; white-space: nowrap; }
.fuel-items { margin-bottom: 14px; }
.fuel-item { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 8px; }
.fuel-item.editing { border-color: var(--fuel-line); background: var(--fuel-soft); }
.fi-main { flex: 1; min-width: 0; }
.fi-a { font: 800 18px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.fi-m { color: var(--text-2); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.icon-btn.armed { width: auto; padding: 0 12px; font-size: 13px; font-weight: 700; color: var(--red); background: var(--red-soft); border-color: rgba(239, 102, 112, 0.4); }
.fuel-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.fuel-fields .label { margin-top: 0; }
.field.sm { min-height: 54px; font-size: 22px; padding: 0 14px; }
.field.sm::placeholder { font-size: 14px; font-weight: 500; letter-spacing: 0; }
.txt-in { width: 100%; min-height: 48px; padding: 0 14px; border-radius: var(--r-ctl); background: var(--bg); border: 1px solid var(--line-2); font-size: 14.5px; }
.txt-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.group-head { padding: 8px 2px 0; }
@media (min-width: 640px) { .tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fuel-big { font: 800 34px/1.05 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--fuel); }
.today-card .btn-row .btn:not(.fuel) { flex: 1 1 220px; }
.today-card .btn-row .btn.fuel { flex: 1 1 130px; }


/* ============================================================

   ============================================================ */

  --line-2: rgba(60, 60, 67, 0.17);
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #8e8e93;
  --accent: #007aff;

  --r-ctl: 16px;
  color-scheme: light;
}
:root[data-app-theme='light'] { color-scheme: light; }
:root[data-app-theme='auto'] {
  --bg: #f5f5f7; --bg-glow: rgba(0, 122, 255, 0.055); --surface: #ffffff;
  --surface-2: #f2f2f7; --surface-3: #e5e5ea; --line: rgba(60,60,67,.10);
  --line-2: rgba(60,60,67,.17); --text: #1d1d1f; --text-2: #6e6e73; --text-3: #8e8e93;
  --accent: #007aff; --accent-2: #0066d6; --accent-ink: #ffffff; --accent-soft: rgba(0,122,255,.10);
  --amber: #b76e00; --amber-soft: rgba(255,159,10,.13); --red: #d70015; --red-soft: rgba(255,59,48,.10);
  --fuel: #bf5700; --fuel-soft: rgba(255,149,0,.12); --fuel-line: rgba(191,87,0,.25);
  --idle: #c7c7cc; --idle-soft: rgba(60,60,67,.045); --grid: rgba(60,60,67,.08);
  --shadow: 0 14px 38px rgba(30,34,44,.10); --overlay: rgba(20,22,28,.34); --nav-bg: rgba(255,255,255,.78);

}

  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --line: rgba(255, 255, 255, 0.09);
  --line-2: rgba(255, 255, 255, 0.16);
  --text: #f5f5f7;
  --text-2: #aeaeb2;
  --text-3: #8e8e93;
  --accent: #0a84ff;
  --accent-2: #409cff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(10, 132, 255, 0.17);
  --amber: #ffb340;
  --amber-soft: rgba(255, 159, 10, 0.16);
  --red: #ff453a;
  --red-soft: rgba(255, 69, 58, 0.16);
  --fuel: #ff9f0a;

@media (prefers-color-scheme: dark) {
  :root[data-app-theme='auto'] {
    --bg: #000000; --bg-glow: rgba(10, 132, 255, 0.10); --surface: #1c1c1e;
    --surface-2: #2c2c2e; --surface-3: #3a3a3c; --line: rgba(255,255,255,.09);
    --line-2: rgba(255,255,255,.16); --text: #f5f5f7; --text-2: #aeaeb2; --text-3: #8e8e93;
    --accent: #0a84ff; --accent-2: #409cff; --accent-ink: #fff; --accent-soft: rgba(10,132,255,.17);
    --amber: #ffb340; --amber-soft: rgba(255,159,10,.16); --red: #ff453a; --red-soft: rgba(255,69,58,.16);

    --idle: #48484a; --idle-soft: rgba(255,255,255,.055); --grid: rgba(255,255,255,.08);
    --shadow: 0 18px 50px rgba(0,0,0,.28); --overlay: rgba(0,0,0,.58); --nav-bg: rgba(28,28,30,.78);

* { -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  letter-spacing: -0.012em;
  font-size: 15px;
}
body::after { background: radial-gradient(700px 360px at 50% -10%, var(--bg-glow), transparent 72%); }
button, input, textarea { font-family: var(--font-body); }
.main {
  max-width: 780px;
  padding-top: max(26px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
}
.view { gap: 17px; }
.brand h1 { font: 750 22px/1.08 var(--font-display); letter-spacing: -0.045em; text-transform: none; }
.brand p { font-size: 13px; letter-spacing: -0.01em; }
.date-line { font-size: 12px; }
.streak { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.035); }
.screen-title { font: 750 28px/1.08 var(--font-display); letter-spacing: -0.045em; }
.screen-sub { font-size: 14px; letter-spacing: -0.015em; }
.card, .tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  box-shadow: 0 3px 14px rgba(25, 35, 50, 0.035);
}
.card { padding: 19px; }
.card h2, .card-title { font: 700 15px/1.25 var(--font-display); letter-spacing: -0.02em; }
.eyebrow { letter-spacing: .07em; }
.hero { padding: 21px 19px 17px; }
.hero::before { background: radial-gradient(circle, var(--accent-soft), transparent 70%); }
.ring-fg { filter: drop-shadow(0 3px 7px var(--accent-soft)); }
.ring-center .big { font-family: var(--font-display); font-weight: 760; letter-spacing: -0.05em; }
.today-row .big { font-family: var(--font-display); font-weight: 760; letter-spacing: -0.045em; }
.btn {
  min-height: 50px;
  border-radius: 16px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.018em;
  box-shadow: 0 1px 1px rgba(0,0,0,.025);
}
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 3px 9px rgba(0,122,255,.18); }
.btn.primary:active { background: var(--accent-2); }
.btn.ghost { background: transparent; }

<body>
<div class="app">
  <main class="main" id="main"><div id="view" aria-live="off"></div></main>
  <nav class="nav" id="nav" aria-label="Разделы"></nav>
  <div id="overlay"></div><div id="cele"></div><div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* МОЯ ЦЕЛЬ — расчётное ядро.
   Чистые функции без обращения к DOM: их можно проверять в Node (test/logic.test.js).
   Все суммы считаются в копейках (целые числа), поэтому 0,1 + 0,2 даёт ровно 0,3,
   а реальные суммы заработка нигде не округляются. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Goal = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const APP_ID = 'moya-cel';
  const CFG = {
    start: '2026-11-16',
    end: '2026-12-31',
    daily: 2000,
    weekLen: 7,
    periodLen: 14,
    maxAmount: 1000000,
    noteMax: 500,
    fuelMax: 30,
    litersMax: 1000,
    fuelNoteMax: 200
  };
  const NBSP = ' ';
  const DAY_MS = 86400000;

  /* ---------- даты (строки YYYY-MM-DD, расчёт в UTC, без часовых поясов) ---------- */
  const pad = (n) => (n < 10 ? '0' : '') + n;

  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    const t = Date.UTC(y, mo - 1, d);
    const dt = new Date(t);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return t;
  }
  function fmtDate(t) {
    const d = new Date(t);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  const addDays = (s, n) => fmtDate(parseDate(s) + n * DAY_MS);
  const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / DAY_MS);
  const weekdayIdx = (s) => (new Date(parseDate(s)).getUTCDay() + 6) % 7; // 0 = понедельник
  const dayOfMonth = (s) => new Date(parseDate(s)).getUTCDate();
  const monthIdx = (s) => new Date(parseDate(s)).getUTCMonth();
  const yearOf = (s) => new Date(parseDate(s)).getUTCFullYear();
  function todayStr(now) {
    const n = now || new Date();
    return n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  }
  const isInPeriod = (s) => parseDate(s) !== null && s >= CFG.start && s <= CFG.end;

  const DAYS = (function () {
    const out = [];
    const n = diffDays(CFG.start, CFG.end) + 1;
    for (let i = 0; i < n; i++) out.push(addDays(CFG.start, i));
    return out;
  })();
  const GOAL_KOP = CFG.daily * 100;
  const TOTAL_KOP = GOAL_KOP * DAYS.length;
  const FIRST_MONDAY = addDays(CFG.start, -weekdayIdx(CFG.start));

  /* ---------- форматирование ---------- */
  const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const MONTHS_SHORT = ['янв', 'февр', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сент', 'окт', 'нояб', 'дек'];
  const WEEKDAYS_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
  const WEEKDAYS_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

  function pluralRu(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  const daysWord = (n) => n + NBSP + pluralRu(n, 'день', 'дня', 'дней');

  // число в рублях: целые без копеек, реальные копейки сохраняются (1 234,50)
  function fmtNum(n) {
    const k = Math.round(Math.abs(n) * 100);
    const neg = n < 0 && k !== 0;
    const intPart = Math.floor(k / 100);
    const frac = k % 100;
    const s = String(intPart).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
    return (neg ? '−' : '') + s + (frac ? ',' + pad(frac) : '');
  }
  const fmtRub = (n) => fmtNum(n) + NBSP + '₽';
  function fmtSigned(n) {
    const k = Math.round(n * 100);
    return (k > 0 ? '+' : k < 0 ? '−' : '') + fmtNum(Math.abs(n)) + NBSP + '₽';
  }
  function fmtPct(p) {
    if (p === null || p === undefined || !isFinite(p)) return '—';
    return String(Math.round(p * 10) / 10).replace('.', ',') + '%';
  }
  const fmtLong = (s) => WEEKDAYS_FULL[weekdayIdx(s)] + ', ' + dayOfMonth(s) + ' ' + MONTHS_GEN[monthIdx(s)] + ' ' + yearOf(s);
  const fmtDay = (s) => dayOfMonth(s) + ' ' + MONTHS_GEN[monthIdx(s)];
  const fmtDayShort = (s) => dayOfMonth(s) + ' ' + MONTHS_SHORT[monthIdx(s)];
  const fmtWeekdayDay = (s) => WEEKDAYS_FULL[weekdayIdx(s)] + ', ' + fmtDay(s);
  function fmtRange(a, b) {
    if (monthIdx(a) === monthIdx(b)) return dayOfMonth(a) + '–' + dayOfMonth(b) + ' ' + MONTHS_SHORT[monthIdx(b)];
    return fmtDayShort(a) + ' – ' + fmtDayShort(b);
  }

  /* ---------- ввод суммы ---------- */
  function parseAmount(input) {
    const s = String(input === null || input === undefined ? '' : input)
      .replace(/[\s  ]/g, '')
      .replace(/₽/g, '')
      .replace(',', '.');
    if (s === '') return { ok: false, error: 'empty' };
    if (!/^\d+(\.\d{1,2})?$/.test(s)) {
      return { ok: false, error: /^\d+\.\d{3,}$/.test(s) ? 'decimals' : 'format' };
    }
    const v = Number(s);
    if (v > CFG.maxAmount) return { ok: false, error: 'max' };
    return { ok: true, value: v };
  }
  const AMOUNT_ERRORS = {
    empty: 'Введите сумму или 0, если сегодня не работали',
    format: 'Только цифры, например 2500 или 2500,50',
    decimals: 'Не больше двух знаков после запятой',
    max: 'Слишком большая сумма',
    zero: 'Сумма заправки должна быть больше нуля',
    liters: 'Литры: только цифры, например 32 или 32,5',
    litersZero: 'Литры должны быть больше нуля',
    litersMax: 'Слишком много литров'
  };

  const kop = (rub) => Math.round(rub * 100);
  const rub = (k) => k / 100;

  /* ---------- заправки: отдельный учёт, на план и запас не влияет ---------- */
  function parseFuelAmount(input) {
    const p = parseAmount(input);
    if (p.ok && p.value === 0) return { ok: false, error: 'zero' };
    return p;
  }
  // литры необязательны: пустое поле — это value: null
  function parseLiters(input) {
    const s = String(input === null || input === undefined ? '' : input)
      .replace(/[\s  ]/g, '').replace(/л$/i, '').replace(',', '.');
    if (s === '') return { ok: true, value: null };
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok: false, error: 'liters' };
    const v = Number(s);
    if (v <= 0) return { ok: false, error: 'litersZero' };
    if (v > CFG.litersMax) return { ok: false, error: 'litersMax' };
    return { ok: true, value: v };
  }
  let idSeq = 0;
  const makeId = () => 'f' + Date.now().toString(36) + (idSeq++).toString(36) + Math.random().toString(36).slice(2, 5);
  const fmtLiters = (l) => String(Math.round(l * 100) / 100).replace('.', ',') + NBSP + 'л';
  const fmtPriceL = (p) => fmtNum(Math.round(p * 100) / 100) + NBSP + '₽/л';
  function fuelOf(list) {
    let k = 0, n = 0, liters = 0, kopL = 0;
    (list || []).forEach((e) => {
      const a = kop(e.amount);
      k += a; n++;
      if (e.liters) { liters += e.liters; kopL += a; }
    });
    return { kop: k, n, liters, kopL };
  }

  function statusOf(k, goalKop) {
    if (k === null || k === undefined) return 'empty';
    if (k >= goalKop) return 'done';
    if (k > 0) return 'partial';
    return 'zero';
  }

  /* ---------- состояние ---------- */
  function emptyState() {
    return { v: 1, days: {}, fuel: {}, meta: { lastExport: null, celebrated: {} } };
  }

  function normalizeState(raw) {
    const out = emptyState();
    const info = { skipped: 0, fuelSkipped: 0, issues: [] };
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      info.issues.push('Данные имеют неверный формат');
      return { state: out, info };
    }
    const days = raw.days && typeof raw.days === 'object' && !Array.isArray(raw.days) ? raw.days : {};
    Object.keys(days).forEach((key) => {
      const e = days[key];
      if (!isInPeriod(key) || !e || typeof e !== 'object') { info.skipped++; return; }
      let amount = e.amount;
      if (typeof amount === 'string') {
        const p = parseAmount(amount);
        amount = p.ok ? p.value : NaN;
      }
      if (typeof amount !== 'number' || !isFinite(amount) || amount < 0 || amount > CFG.maxAmount ||
          Math.abs(amount * 100 - Math.round(amount * 100)) > 1e-6) {
        info.skipped++;
        return;
      }
      out.days[key] = {
        amount: rub(kop(amount)),
        note: typeof e.note === 'string' ? e.note.trim().slice(0, CFG.noteMax) : '',
        ts: typeof e.updatedAt === 'string' ? e.updatedAt : (typeof e.ts === 'string' ? e.ts : null)
      };
    });
    const fuelRaw = raw.fuel && typeof raw.fuel === 'object' && !Array.isArray(raw.fuel) ? raw.fuel : {};
    Object.keys(fuelRaw).forEach((key) => {
      const arr = fuelRaw[key];
      if (!isInPeriod(key) || !Array.isArray(arr)) { info.fuelSkipped += Array.isArray(arr) ? arr.length : 1; return; }
      const list = [];
      arr.forEach((e, i) => {
        if (list.length >= CFG.fuelMax || !e || typeof e !== 'object') { info.fuelSkipped++; return; }
        let a = e.amount;
        if (typeof a === 'string') { const p = parseFuelAmount(a); a = p.ok ? p.value : NaN; }
        if (typeof a !== 'number' || !isFinite(a) || a <= 0 || a > CFG.maxAmount || Math.abs(a * 100 - Math.round(a * 100)) > 1e-6) { info.fuelSkipped++; return; }
        let l = e.liters;
        if (typeof l === 'string') { const p = parseLiters(l); l = p.ok ? p.value : null; }
        if (typeof l !== 'number' || !isFinite(l) || l <= 0 || l > CFG.litersMax || Math.abs(l * 100 - Math.round(l * 100)) > 1e-6) l = null;
        list.push({
          id: typeof e.id === 'string' && e.id ? e.id.slice(0, 40) : 'f' + key + '-' + i,
          amount: rub(kop(a)),
          liters: l,
          note: typeof e.note === 'string' ? e.note.trim().slice(0, CFG.fuelNoteMax) : '',
          ts: typeof e.createdAt === 'string' ? e.createdAt : (typeof e.ts === 'string' ? e.ts : null)
        });
      });
      if (list.length) out.fuel[key] = list;
    });
    const meta = raw.meta && typeof raw.meta === 'object' ? raw.meta : {};
    if (typeof meta.lastExport === 'string' && !isNaN(Date.parse(meta.lastExport))) out.meta.lastExport = meta.lastExport;
    if (meta.celebrated && typeof meta.celebrated === 'object') {
      ACH.forEach((a) => { if (meta.celebrated[a.id] === true) out.meta.celebrated[a.id] = true; });
    }
    return { state: out, info };
  }

  function exportData(state, nowIso) {
    const days = {};
    Object.keys(state.days).sort().forEach((k) => {
      const e = state.days[k];
      days[k] = { amount: e.amount, note: e.note || '', updatedAt: e.ts || null };
    });
    const fuel = {};
    Object.keys(state.fuel || {}).sort().forEach((k) => {
      fuel[k] = state.fuel[k].map((e) => ({ id: e.id, amount: e.amount, liters: e.liters, note: e.note || '', createdAt: e.ts || null }));
    });
    return {
      app: APP_ID,
      version: 1,
      exportedAt: nowIso || new Date().toISOString(),
      period: { start: CFG.start, end: CFG.end, dailyGoal: CFG.daily },
      days,
      fuel
    };
  }

  function parseImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) {
      return { ok: false, error: 'Не удалось прочитать файл. Нужна резервная копия в формате JSON.' };
    }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
      return { ok: false, error: 'Файл не похож на резервную копию приложения.' };
    }
    if (obj.app && obj.app !== APP_ID) return { ok: false, error: 'Это резервная копия другого приложения.' };
    if (!obj.days || typeof obj.days !== 'object' || Array.isArray(obj.days)) {
      return { ok: false, error: 'В файле нет раздела с записями по дням.' };
    }
    const rawCount = Object.keys(obj.days).length;
    const { state, info } = normalizeState(obj);
    const count = Object.keys(state.days).length;
    if (rawCount > 0 && count === 0) {
      return { ok: false, error: 'В файле нет ни одной подходящей записи за период 16.11.2026 — 31.12.2026.' };
    }
    let totalKop = 0;
    Object.keys(state.days).forEach((k) => { totalKop += kop(state.days[k].amount); });
    // метка последней копии из файла не переносится: решает только факт нового экспорта
    state.meta.lastExport = null;
    let fuelKop = 0, fuelCount = 0;
    Object.keys(state.fuel).forEach((k) => state.fuel[k].forEach((e) => { fuelKop += kop(e.amount); fuelCount++; }));
    return {
      ok: true, state, count, skipped: info.skipped, total: rub(totalKop),
